decisions_acknowledged:
  - "Held-out store is APPEND-ONLY + event-sourced (submitted/scored/published) with a sha256 content-hash chain (prev_hash links, GENESIS_HASH first); verify_chain() recomputes + detects any line mutation. It is tamper-EVIDENT, not tamper-PROOF against the log owner (honest framing)."
  - "Held-out GOLD is NEVER stored (FR-023): append() rejects {gold,gold_labels,held_out,held_out_labels,answers,ground_truth} BEFORE any write. The store records scores + config-version + the CoI attestation (provenance) only."
  - "Determinism (AX-002): the store uses a monotonic seq for ordering and NO clock/RNG (no time/datetime import) — a wall-clock timestamp, if any, is an optional caller payload field, never generated. Re-appending the same events yields identical hashes."
  - "Anti-gaming (NFR-014): opt-in publish (published requires allowed AND publish_opt_in — a disallowed submission is never published) + rate-limit (per submitter per current epoch) + held-out rotation epoch (stale-epoch rejected) + contamination/duplicate (re-used submission_hash flagged), each a distinct reason; the policy is read-only over the store."
  - "gov-03 recusal (FR-026): CoIRecord carries a non-strippable NO_PREPUB_ATTESTATION (__post_init__ rejects empty) + requires_recusal True for maintainer / any pii-anon-core affiliation (lower+strip+substring, evasion-resistant for casing/whitespace/suffix). as_dict() rides in a `submitted` store event."
  - "Epistemic honesty (S6-04): GOVERNANCE.md flags the advisory roster ASPIRATIONAL / AGENT_SIMULATED (zero fabricated members) and states bus-factor = 1 / single maintainer plainly; every CoI/neutrality claim maps to real code (verify_chain, opt-in publish + anti-gaming policy, recusal). v1 is a governance SEAM, not a hosted service."
  - "The two governance DOC stories (S6-04 GOVERNANCE.md / S6-05 CONTRIBUTING.md) were authored directly by the orchestrator with strict RED→GREEN (a property test pins each doc's required sections) and reviewed jointly in one combined 5-reviewer story gate (_reviews/story/S6-04-05/) for efficiency — per-story FR mapping + RED/GREEN evidence preserved."

