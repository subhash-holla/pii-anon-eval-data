decisions_acknowledged:
  - "L4 (loader strategy) RESOLVED = FIX the pii-rate-elo bundled parser to v2.0.0 + 5-tuple regression contract; reserve pii_anon_datasets.load_dataset for the eval-data sampler side. Grounded firsthand: load_dataset(__init__.py:55) has NO version arg; the drift is metadata-provenance only; both parsers read the same on-disk corpus via resolve_eval_dataset_path (no shared import)."
  - "P1 quarantine = a two-predicate CI gate: (a) static-AST import-graph closure from BOTH assessment entrypoints asserts pii_rate_elo_pipeline.analysis.significance is unreachable (module-level, since the eager `_tester_instance = SignificanceTester()` constructs the fabricated tester on any import) + (b) configs/assessment.yaml run_significance_tests:false; plus a fabrication-regex lint. Holm lands in net-new audited stats/multitest.py, NEVER significance.py."
  - "Sampler determinism = per-cell child RNG random.Random((seed, cell_id)) (NOT one shared RNG fanned across cells; Algorithm-R is order-dependent); byte-repro conditional on pinned {corpus content_hash, lattice_version, seed}; sampler_version = sha256 of the FULL §7 closure; ut5 integers frozen into the hashed payload."
  - "Multiplicity = Holm WITHIN each (metric, scoring-family) partition, never pooled across metrics or anon/pseudo (AX-004); family_size = #pairs × #metrics in the confirmatory set, asserted == prereg. Rank oracle = adjacent-pair paired-Δ + McNemar (marginal CIs descriptive-only). Full-corpus = descriptive-census (no-CI default unless --super-population)."
  - "Architecture = Hexagonal: domain hexagon (stats + assessment) imports only stdlib + own ports; adapters (EloEngineAdapter / JsonlCorpusAdapter / MatplotlibFigureAdapter) are the only code naming pii-rate-elo or heavy deps; report.py calls the Clean stats ring directly (no port); EloEngineAdapter has NO edge to stats/* (fabricated path on a disjoint sub-graph)."
  - "UT-1 CORRECTION (load-bearing): the D6 synthesis agent claimed pii-rate-elo has 'zero .py files on this machine' — this is WRONG (the agent used a bad relative path). The sister repo at ../pii-anon-research-paper/pii-rate-elo-pipeline IS present and was verified firsthand this session: significance.py read in full (fabrication confirmed at L205-206/L271-281), converters/schema drift pins confirmed (L93/L221/L222/L137), and its test suite ran 253 passed/1 skip. S8 story-0 (re-confirm) is therefore DONE; the design is drift-robust regardless."

