findings:
  - id: coverage-S7-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/scoring/adversary/payloads.py:CARRIER_TEMPLATES
    description: |
      FR-017 names the injection payloads "multilingual/obfuscated." The library SHIPS six
      multilingual carrier templates (en/es/fr/de/ja/ar) — so the "multilingual" qualifier is
      implemented — but `build_payloads(span)` defaults to the English carrier (CARRIER_TEMPLATES[0])
      and no test exercises a non-English carrier. This is a coverage-of-the-qualifier gap, not a
      missing capability: the multilingual surface exists and is reachable via the `carrier=` kwarg.
      Already logged identically at the S7-02 story gate (requirements-coverage 1 OBS). Non-blocking
      at the sprint bar — FR-017 is FULLY covered (oracle S7-01 + payloads S7-02), the multilingual
      carrier is a cheap v1.1 test nicety.
    suggested_resolution: |
      In a future maintenance pass (or v1.1), add one parametrized test that calls
      `build_payloads(span, carrier=CARRIER_TEMPLATES[i])` for a non-Latin carrier (e.g. the
      Japanese or Arabic template) and asserts `render()` substitutes the obfuscated span into that
      carrier, exercising the FR-017 "multilingual" qualifier end-to-end. No production change needed.
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-017
      - dev-assist-artifacts/04-development/_reviews/story/S7-02/synthesis.md

