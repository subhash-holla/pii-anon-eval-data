findings:
  - id: performance-S7-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/validation/correlation.py:176
    description: |
      The Kendall-tau bootstrap is the one super-linear cost on the S7 seam surface.
      kendall_tau() is O(n^2) (concordant/discordant over all i<j pairs, lines 103-114),
      and _bootstrap_ci() invokes the pair-statistic n_boot times (default 1000), so the
      tau CI is O(n^2 * n_boot). Empirically measured (n_boot=1000, tau+rho together):
      n=50 -> 0.32s, n=100 -> 1.07s, n=200 -> 3.95s, n=400 -> 15.4s — i.e. the cost
      roughly quadruples per doubling of n, the textbook O(n^2) signature.

      For the INTENDED scale this is a non-issue: the real-data validation slice (FR-027,
      v1.1 SEAM) is dozens-to-low-hundreds of PAIRED detector scores, where the whole
      correlate() call is sub-second to a few seconds in an offline, one-shot validation
      harness. There is NO corpus hot-path leakage: grep confirms the only caller of
      kendall_tau/_bootstrap_ci is correlate() itself plus tests/test_correlation.py over
      small fixtures; the 575K-row corpus never reaches the tau-bootstrap (the scoring
      reidentification.py correlate_index_vs_rrs is a SEPARATE O(n) Pearson/Spearman path,
      not this O(n^2) tau). No NFR budget applies to this v1.1 seam (advisory gate).

      Flagged purely so the quadratic-in-n cost is on record before any future caller
      attempts a large-n (n in the thousands) tau-bootstrap.
    suggested_resolution: |
      No change required for v1.1 / the intended validation-slice scale. As a v1.x guard,
      IF a future use feeds large n (thousands of pairs) into correlate(): either
      (a) sub-sample the paired scores to a fixed cap (e.g. n<=500) before the tau-bootstrap
      and record the cap in the CorrelationResult, or (b) swap kendall_tau() for an
      O(n log n) merge-sort-inversion tau-b implementation so the bootstrap becomes
      O(n log n * n_boot). Optionally add a soft-warn (or a documented n threshold) in
      correlate() when n is large enough that the O(n^2 * n_boot) cost is material.
    references:
      - dev-assist-artifacts/02-requirements/non-functional-requirements.md
      - dev-assist-artifacts/04-development/02-stories/sprint-7/S7-01.md

