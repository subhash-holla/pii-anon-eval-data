findings:
  - id: code-quality-S3-07-01
    severity: MINOR
    location: src/pii_anon_datasets/scoring/pseudonymization.py:92
    description: |
      `ThreatModel.has` is a public concrete method (not a Protocol stub, not `__dunder__`)
      and carries no docstring. Per contributor-readiness policy (NFR-005/AX-004 flavour),
      every public surface item touched by the story should have a pydoc entry. The method
      is self-evident but technically violates the "every public `pub`/`export` has docs"
      check (pattern 4 of 15). It is a one-liner (`return capability in self.capabilities`)
      whose intent is clear from the class docstring, so this is non-blocking MINOR.
    suggested_resolution: |
      Add a one-line docstring, e.g.:
        def has(self, capability: AttackerCapability) -> bool:
            """Return True if *capability* is in this model's enumerated capability set."""
            return capability in self.capabilities
    references:
      - dev-assist-artifacts/04-development/02-stories/sprint-3/S3-07.md#10

  - id: code-quality-S3-07-02
    severity: OBSERVATION
    location: src/pii_anon_datasets/scoring/pseudonymization.py:115-117
    description: |
      `Pseudonymizer.pseudonymize` and `Pseudonymizer.reverse` are Protocol stub methods
      (body is `...`). They carry no individual docstrings; their semantics are documented
      in the class-level docstring on `Pseudonymizer`. For `@runtime_checkable Protocol`
      stubs this is idiomatic Python — the class docstring is the canonical place for
      member semantics. Noted for completeness; not a blocking issue.
    suggested_resolution: |
      No required change. Optionally add inline one-liners to each stub body for IDE
      tooltips:
        def pseudonymize(self, value: str, entity_type: str, *, context_key: str) -> str:
            """Map *value* (of *entity_type*, scoped to *context_key*) to its pseudonym."""
            ...
        def reverse(self, pseudonym: str, entity_type: str, *, secret: object) -> str | None:
            """Return original plaintext for *pseudonym* iff *secret* is the held key; else None."""
            ...

  - id: code-quality-S3-07-03
    severity: OBSERVATION
    location: src/pii_anon_datasets/scoring/pseudonymization.py (overall)
    description: |
      `mypy --strict --follow-imports=silent` exits non-zero due to the pre-existing
      `reidentification.py:69` `dict` missing type-params error (foundation commit `75e9eed`,
      predates S3-07; not in §8 owned files). Under `--follow-imports=skip` (which scopes
      mypy to only the target file), `pseudonymization.py` reports zero diagnostics. The
      new file itself is fully mypy-strict clean. The pre-existing error is out of scope for
      S3-07 and was correctly not touched (scope discipline preserved). Noted per executor's
      deviation §1.
    suggested_resolution: |
      Fix the pre-existing nit in a separate chore commit (S3-04 owned file):
        # reidentification.py:69
        def as_dict(self) -> dict[str, object]:   # was: dict (bare)
      This should be tracked as a standalone follow-up, NOT folded into S3-07.

