critical_coverage_checks:
  - id: CRIT-A
    requirement: FR-012
    claim: >-
      The two collision counts are SEPARATE; a correct deterministic
      pseudonymizer has unintended_crypto_collisions == 0 with NO
      total_collisions field.
    status: VERIFIED
    test: test_fr_012_correct_deterministic_has_zero_crypto_collisions
    evidence: >-
      tests/test_pseudonymization.py:161-165 asserts unintended_crypto_collisions==0,
      intended_linkage_collisions>0, `not hasattr(report,'total_collisions')`, and
      `"total_collisions" not in report.as_dict()`. pseudonymization.py:173-174
      declares the two as distinct int fields; as_dict (182-216) emits them
      separately and never a sum; _collision_counts (240-275) computes them as
      independent integers. Faulty path covered by
      test_fr_012_faulty_pseudonymizer_flags_crypto_collisions (crypto>0 with a
      wilson Interval, integer n).
  - id: CRIT-B
    requirement: FR-013
    claim: >-
      bare-md5 → rejoinable_from_artifact_alone == True (Art 4(5) failure
      expressed); salted → False.
    status: VERIFIED
    test: test_fr_013_key_state_separation_edpb_art4_5
    evidence: >-
      tests/test_pseudonymization.py:278-289 asserts _BareMd5 →
      rejoinable_from_artifact_alone is True with "art"/"4(5)" in note, and
      _ReversibleKeyed → False with "4(5)" in note. pseudonymization.py
      _keyless_rejoinable (301-321) re-derives keyless md5/sha256 digests over the
      closed-world candidate space and matches artifact tokens; score_pseudonymization
      (451-466) sets a non-empty note citing _EDPB_ART_4_5_CITATION
      ("EDPB / GDPR Art. 4(5)"). Finding is EXPRESSED in the verdict note, not
      suppressed; real PseudonymGenerator named as the in-repo example.
  - id: CRIT-C
    requirement: FR-011
    claim: >-
      reversal rates integer→Wilson conditioned on the threat model.
    status: VERIFIED
    test: test_fr_011_reversal_rates_are_threat_conditioned
    evidence: >-
      tests/test_pseudonymization.py:196-202 asserts unauthorized_reversal and
      authorized_reversal are Interval with integer .n and method=="wilson", and
      report.threat_model.model_id=="pseudo-threat-v1". pseudonymization.py
      _unauthorized_reversal (324-344) and _authorized_reversal (347-371) build
      integer (k,n) → wilson_interval(...); model_id pinned onto the report at
      line 469. Authorized≈1.0 / unauthorized≈0.0 for the keyed scheme separately
      proven by test_fr_011_authorized_succeeds_unauthorized_fails_for_keyed (214-215).

acceptance_clause_coverage:  # §7 G/W/T
  - clause: "FR-011 unauthorized + authorized reversal emitted vs named ThreatModel"
    status: COVERED
    tests: [test_fr_011_reversal_rates_are_threat_conditioned, test_fr_011_authorized_succeeds_unauthorized_fails_for_keyed]
  - clause: "FR-012 intended-linkage vs unintended-crypto reported as SEPARATE integers, never summed"
    status: COVERED
    tests: [test_fr_012_correct_deterministic_has_zero_crypto_collisions, test_fr_012_faulty_pseudonymizer_flags_crypto_collisions]
  - clause: "FR-013 referential integrity + key-rotation + key/state separation (Art 4(5)) verdicts emitted"
    status: COVERED
    tests: [test_fr_013_referential_integrity_join_stable, test_fr_013_key_rotation, test_fr_013_key_state_separation_edpb_art4_5]
  - clause: "Negative: correct deterministic pseudonymizer not penalized; no total_collisions/combined/deid field"
