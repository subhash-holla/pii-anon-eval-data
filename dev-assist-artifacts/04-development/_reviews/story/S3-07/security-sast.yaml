  Pattern 15 (weak hash primitive md5/sha1) — present-but-NOT-a-finding (DELIBERATE,
  DISAMBIGUATED): md5 appears in two places, and in BOTH it is a DETECTION tool over a
  closed-world candidate set, never a security primitive protecting a secret:
    - _KEYLESS_DIGESTS = ("md5","sha256") (L56) and _keyless_rejoinable/_unauthorized_reversal
      (L301-344) re-derive PUBLIC keyless digests to PROVE that a keyless scheme is reversible
      from the artifact alone. md5 here is the adversary's/auditor's probe FOR the weakness, not
      a defense. Using md5 (and sha256) is exactly correct — the scorer must model what a
      secret-less attacker can compute.
    - _BareMd5Pseudonymizer (test) intentionally MODELS the known-weak real PseudonymGenerator
      so the scorer can flag it. That is the system-under-test's fault being demonstrated, not
      introduced by this code.
    No sha1 anywhere. No md5 is used for integrity/auth/secret protection. Per scope, "weak hash
    introduced for non-checksum purpose" does not apply: md5 is used precisely to detect/express
    a weakness, which is the control's purpose. Recorded as an OBSERVATION, not a MAJOR finding.

