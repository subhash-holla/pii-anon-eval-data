  PRIMARY (the [AUDIT] privacy controls) — both VERIFIED SOUND
  ================================================================================

  (1) FR-012 collision-type SEPARATION is a correct privacy-correctness control — a correct
      deterministic pseudonymizer is NEVER falsely flagged. VERIFIED on three grounds:
        a. _collision_counts (pseudonymization.py:240-275) computes the two categories by TWO
           INDEPENDENT passes and returns them as separate tuple elements
           (intended, len(crypto_reals), n_distinct) — they are never added. `intended`
           (L263-267) sums 1 ONLY over same-real repeats resolving to a single pseudonym (the
           deterministic-linkage FEATURE). `crypto_reals` (L270-273) is a disjoint set() of
           DISTINCT reals colliding on one token (the FAULT). The two `sum(...)` call sites in
           the module (L263 intended-linkage counter, L285 broken-joins counter, L343 recovered
           counter) are each WITHIN-category cardinality counters — none crosses the
           intended/unintended boundary. Intended-linkage and unintended-crypto are structurally
           incapable of being conflated.
        b. The report (PseudonymizationReport, L161-216) surfaces intended_linkage_collisions
           and unintended_crypto_collisions as two separate int fields and as two separate
           as_dict keys (L194-195); there is DELIBERATELY no total_collisions / combined / deid /
           overall / utility / residual_risk field or key anywhere in the module (confirmed by
           grep + by the as_dict body). A correct deterministic scheme yields crypto_reals == {}
           => unintended_crypto_collisions == 0, so it cannot be penalized.
        c. Live: test_fr_012_correct_deterministic_has_zero_crypto_collisions [AUDIT] PASSES
           (_ReversibleKeyed -> unintended==0, intended>0, no total_collisions attr/key);
           test_nfr005_report_has_no_anonymization_or_combined_field [AUDIT] PASSES (forbidden
           set {utility,residual_risk,combined,deid,overall,total_collisions} disjoint from
           attrs AND as_dict keys — the within-module AX-004/NFR-005 guard).

  (2) FR-013 EDPB Art 4(5) key/state-separation logic is sound — _keyless_rejoinable correctly
      detects a no-secret artifact is self-rejoinable (bare-md5 -> True), and the finding is
      EXPRESSED, not hidden. VERIFIED:
        a. _keyless_rejoinable (L301-321) re-derives the keyless public digests (md5 + sha256,
           plus common truncations/prefixes) over the CLOSED-WORLD candidate plaintext space
           (the artifact's own distinct real values) and returns True iff a derived token
           matches an actual artifact token. For _BareMd5 (pseudonym = "MD5_"+md5(value)[:12],
           no salt/secret) this matches => rejoinable_from_artifact_alone = True (correctly
           FAILS Art 4(5)). For _ReversibleKeyed (HMAC-shaped sha256 over secret|salt|...) no
           keyless derivation reproduces a token => False. Logic is correct and conservative
           (closed-world, public-hash only, no secret needed — exactly what makes a keyless
           scheme fail and a keyed scheme pass).
        b. EXPRESSED-not-hidden: KeyStateSeparationResult.note (built L452-465) is non-empty,
           cites the Art-4(5) literal (_EDPB_ART_4_5_CITATION = "EDPB / GDPR Art. 4(5)", L51),
           and on the rejoinable branch NAMES the real example by full path:
           "scripts/enrich_context_preservation.py::PseudonymGenerator has exactly this shape."
           The Protocol docstring (L108-110) and the module header (L24-29) repeat this. The
           result note is surfaced as the report verdict (KeyStateSeparationResult.__post_init__
           hard-fails on an empty note, L153-155), so the finding cannot be silently dropped.
        c. Live: test_fr_013_key_state_separation_edpb_art4_5 [AUDIT] PASSES (bare-md5 ->
           rejoinable True with "art"/"4(5)" in note; keyed -> False with "4(5)" in note).

