    - "FR semantic validity -> axiom-compliance"
    - "whether requirement should exist -> SME, not per-story"
    - "full T1/T2/T3 snapshot -> epic/sprint gate, not story gate"

decision_rule: "APPROVE iff zero MAJOR+; tally shows 0 MAJOR+ -> APPROVE"
