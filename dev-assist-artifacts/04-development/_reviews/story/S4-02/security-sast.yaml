threat_surface:
  classification: pure-numerical-compute   # paired-test math over (b,c) integers + boolean pairs; no trust boundary, no capability, no egress, no I/O
  inputs: "two ints (b, c); a Sequence[tuple[bool,bool]] of A/B hit flags; n_boot:int, seed:int, confidence:float. No strings, no paths, no network, no deserialization."
  trust_boundary_touched: false
  capability_registry_touched: false
  composition_root_ban_relevant: false   # Python pure-stdlib module; no SDK/crate dependency edge introduced
  hsm_signing_path_touched: false
  network_egress_added: false
  unsafe_block_added: false               # Python; n/a — no ctypes/FFI/cffi either

pure_stdlib_no_new_dependency:   # NFR-004 — PRIMARY dispatch concern
  confirmed: true
  paired_py_imports: "math, random, collections.abc.Sequence, dataclasses, .intervals (intra-package). NOTHING else."
  init_py_imports: "intra-package only (.intervals, .paired, .power)."
  test_py_imports: "ast, math, pathlib, pytest, intra-package. (pathlib is used read-only on paired_mod.__file__ to AST-self-inspect the source — not a runtime filesystem dependency of the module under test.)"
  banned_modules_absent: true   # NONE of numpy / scipy / socket / requests / urllib / httpx / subprocess / pickle / marshal / yaml / secrets / os.system / open() present in paired.py
  eval_exec_dynimport_absent: true   # no eval / exec / compile / __import__ / input anywhere in paired.py
  note: >
    grep 'hits' for the banned-token sweep resolve to docstring prose only — line 19 'evaluates'
    (substring 'eval') in the module docstring; there is no executable eval/exec/import-dynamic.

rng_determinism_analysis:   # PRIMARY dispatch concern — seeded LOCAL random.Random, NOT module-global, NOT secrets
  random_used: true
  uses_local_random_Random_seed: true       # line 140: `rng = random.Random(seed)` — a LOCAL instance owned by the call
  uses_module_global_rng: false             # the ONLY executable random.<attr> access in paired.py is `random.Random`; no random.random()/randrange()/sample()/seed() at module level
  uses_secrets_module: false                # `secrets` is NOT imported and MUST NOT be — see crypto-context determination below
  ast_guard_present: true                   # test_fr_002_nfr004_paired_imports_no_uncontrolled_nondeterminism statically asserts (a) {time,uuid,datetime,secrets} disjoint from imports, (b) every `random.<attr>` access == `random.Random`
  runtime_global_rng_isolation_proven: true # test seeds the module-global RNG to 0 then 999999 and asserts byte-identical results -> the global RNG is provably never consulted
  weak_crypto_finding: false
  crypto_context_determination: >
    NOT-A-WEAK-CRYPTO-FINDING. The seeded random.Random(seed) here is a DETERMINISM control for a
    statistical bootstrap (NFR-004: two runs with the same seed must be byte-identical and
    reproducible for scientific auditability), NOT a security/cryptographic context. There is no
    key generation, token/nonce/salt minting, password, session id, or any secret derived from this
    RNG — it only selects resample indices (rng.randrange(n)) for a percentile CI over boolean
    detector-hit flags. Mandating `secrets` here would be WRONG: it would destroy the reproducibility
    the requirement demands. stdlib `random.Random` is the correct and required primitive. Catalog
    pattern #15 (weak hash for non-checksum purpose) and the weak-RNG family do NOT apply.

dos_hang_analysis:   # dispatch ask — note if n_boot is unbounded
  while_loops_anywhere: 0          # static: zero `while` in paired.py; every loop is `for _ in range(...)`
  loops_present:
    - "paired_bootstrap_recall_delta: outer `for _ in range(n_boot)` x inner `for _ in range(n)` -> O(n_boot * n) resample work"
    - "mcnemar_exact: `sum(math.comb(n,i) for i in range(0, min(b,c)+1))` -> O(min(b,c)) terms, each a math.comb on n=b+c"
  n_boot_default_bounded: true     # default n_boot = 10000 (a sane, finite default)
  n_boot_caller_controlled_unbounded_param: true   # NOTED per dispatch: n_boot (and len(pairs), and b/c) have NO upper clamp; a caller passing n_boot=10**9 or a huge pairs list would run long
  untrusted_input_path_exists: false   # only caller is the __init__ re-export; no network/CLI/file entrypoint in THIS story wires external/untrusted input into n_boot or pairs. This is a library-internal numeric kernel invoked by trusted in-process callers with literal/sized arguments.
  worst_case_is_long_not_infinite: true   # no infinite-loop path; worst case is a long-but-terminating computation proportional to caller-supplied sizes
  verdict: >
    No DoS/hang vulnerability at this story's trust scope: there is no untrusted-input path that
    reaches n_boot/pairs, and there is no unbounded/infinite loop (worst case is a terminating
    O(n_boot*n) cost the trusted caller explicitly sizes). The absence of an upper clamp on n_boot
    is recorded as OBSERVATION-1 for whoever later wires a public/remote caller, not a current breach.

ax_001_no_real_pii:
  confirmed: true
  detail: >
    The paired API consumes ONLY booleans (A_hit, B_hit) and integers (b, c) — never PII-bearing
    strings. test_paired.py fixtures are exclusively boolean tuples ([(True,False)]*k etc.) and
    small integer counts. Zero email/SSN/PAN/phone/name/private-key/API-key literal in any owned
    file (regex sweep clean). The no-real-PII invariant (AX-001 / sensitive_data_scan) holds.

