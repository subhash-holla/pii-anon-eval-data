  high_cve_new_transitive_dep: none           # #5  — zero new dependencies (no manifest touched)
  hsm_port_signing_contract_bypass: none      # #6  — no HSM/signing path
  new_egress_not_in_manifest: none            # #7  — no network egress added
  hardcoded_credential_shape: none            # #8  — regex sweep for api_key/secret/token/password/AKIA/PRIVATE KEY clean
  sql_nosql_string_interpolation: none        # #9  — no DB access / query string built
  git_pinned_dependency: none                 # #10 — no dependency manifest change
  denied_license_dependency: none             # #11 — no dependency added
  wildcard_capability_scope: none             # #12 — no capability/scope grant
  thread_spawn_crossing_boundary: none        # #13 — no tokio/thread/async-task spawn; single-threaded synchronous loops
  architectural_egress_forbidden_import: none # #14 — imports are stdlib + intra-stats only (.intervals); no cross-subsystem reach
  weak_hash_md5_sha1: none                     # #15 — no hashlib/md5/sha1; the only randomness is the seeded statistical bootstrap (see rng_determinism_analysis)
  pickle_marshal_yaml_load: none
  cve_surface: "no new dependency introduced -> no new CVE / SBOM-diff surface at this story"

test_execution:
  owned_suite: "tests/test_paired.py — 8 fr_002/nfr_002-tokened tests (per story §12: 8 passed; full suite 184 passed / 1 skipped, 0 regressions)"
  ast_self_guard_test: "test_fr_002_nfr004_paired_imports_no_uncontrolled_nondeterminism — statically enforces the stdlib/determinism contract this reviewer relies on"
  note: "AGENT_SIMULATED env per story §12 (Python 3.10, miniforge). Security verdict rests on static analysis of the owned source + the in-tree AST guard, both of which are env-independent."

findings:
  - id: S4-02-SAST-OBS-1
    severity: OBSERVATION
    title: "n_boot / len(pairs) / b,c have no upper clamp — long-but-terminating cost if a future untrusted caller is wired in"
    file: src/pii_anon_datasets/stats/paired.py
    detail: >
      paired_bootstrap_recall_delta runs O(n_boot * len(pairs)) work and mcnemar_exact sums
      O(min(b,c)) math.comb terms, with no maximum enforced on n_boot, len(pairs), or b/c. At THIS
      story's trust scope this is NOT a vulnerability: the only caller is the trusted in-process
      __init__ re-export, no network/CLI/file entrypoint passes untrusted input into these sizes,
      there are ZERO while-loops, and every loop is a finite `for _ in range(...)` (worst case is a
      long-but-terminating computation, never an infinite hang). The sane defaults (n_boot=10000)
      are appropriate. Recorded only so that IF a future story exposes this kernel behind a public
      or remote surface, an input-size guard is added at that boundary then. No action at the
      security gate now.
    breach: false

severity_counts:
  showstopper: 0
  catastrophic: 0
  major: 0
  minor: 0
  observation: 1

summary: >
  S4-02 adds the paired-statistics measurement side of the FR-002 detector A/B regression gate:
  McNemar's test over the discordant pairs (b,c) — exact two-sided binomial tail via math.comb and
  Edwards continuity-corrected χ² via math.erfc, each NFR-002 named-method — plus a seeded paired
  bootstrap recall-Δ CI returned as an Interval(method="paired-bootstrap"). The dispatch's load-bearing
  determination is confirmed: the bootstrap drives every draw from a LOCAL random.Random(seed) (line
  140) and NEVER the module-global RNG and NEVER secrets — and this is correct, because the seeded RNG
  is a DETERMINISM/reproducibility control for a statistical bootstrap (NFR-004), not a cryptographic
  context (no keys/nonces/tokens/secrets derive from it; it only picks resample indices over boolean
  hit-flags). Therefore stdlib `random.Random` is the right primitive and this is explicitly NOT a
  weak-crypto finding; demanding `secrets` would destroy the required byte-identical reproducibility.
  The in-tree AST guard statically proves paired.py imports none of {time,uuid,datetime,secrets} and
  that the sole executable random.<attr> access is `random.Random`, and a runtime test proves the
  module-global RNG (seeded 0 / 999999 by the caller) does not affect the result. Pure-stdlib (math +
  random.Random + dataclasses + intra-package Interval) with ZERO new dependencies -> no CVE/SBOM/egress
  surface; no eval/exec/subprocess/pickle/yaml/socket/filesystem; no weak hash; no SQL; no capability,
  trust-boundary, HSM, or composition-root edge (pure numeric Python). AX-001 holds — the API consumes
  only booleans/ints and the test fixtures are boolean tuples, with zero PII literals. No DoS/hang:
  zero while-loops, all loops finite `for _ in range(...)`; n_boot is bounded-by-default and only
  reached by a trusted in-process caller, so the absence of an upper clamp is a forward-looking
  OBSERVATION (not a breach) for any future untrusted-input wiring. Zero MAJOR+ findings (1 OBSERVATION)
  -> APPROVE.
