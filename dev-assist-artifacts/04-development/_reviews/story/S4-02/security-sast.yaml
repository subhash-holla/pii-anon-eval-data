  pack_patterns_merged: none                    # no reviewer-extensions catalog to merge; no finding carries source_pack
  note: >
    Project ships no domain pack; the no-real-PII invariant is a project-authored axiom
    (project-axioms.yaml AX-001) + hooks.sensitive_data_scan: true, which this reviewer
    verified directly against the owned files rather than via a pack pattern set.

scope_reviewed:
  owned_files:
    - src/pii_anon_datasets/stats/paired.py        # NEW — McNemarResult (frozen) + mcnemar_exact/mcnemar_chi2 + paired_bootstrap_recall_delta + helpers _odds_ratio/_recall_delta/_percentile
    - src/pii_anon_datasets/stats/__init__.py       # MODIFIED — export-only: adds the 4 symbols to the import block + __all__
