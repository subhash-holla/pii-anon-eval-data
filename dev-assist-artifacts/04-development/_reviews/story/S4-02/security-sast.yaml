  diff_range: 1e34f7b   # GREEN is the load-bearing change; REFACTOR d5cafe7 is ruff I001 import-order on the test file only (no production-code change)
  story_diff_is_code_only: true   # only the 3 owned files + story doc changed; no dependency manifest, no data/corpus/snapshot/lattice/tag
