# ── AX-pii-anon-004 — anonymization/pseudonymization separation ──
axiom_AX_pii_anon_004:
  status: UPHELD
  what_checked: "No collapse of distinct metric families into one redaction/de-id score."
  evidence:
    - "Module scores ONE thing: detector recall difference Δ = recall(A) − recall(B) for the A/B-detection regression gate. grep for redaction/de-identification/anonymiz/pseudonym in paired.py → none. No metric-family merge introduced."

# ── NFR-004 purity ──
nfr_004_purity:
  status: UPHELD
  evidence:
    - "Imports: __future__, math, random (used only as random.Random), collections.abc.Sequence, dataclasses, .intervals (S1, read-only reuse). No scipy/numpy/pandas; no nondeterministic stdlib. χ² tail uses closed-form math.erfc; exact tail uses math.comb. Percentile is a hand-rolled deterministic linear interpolation."
    - "n_boot is a FIXED iteration count (default 10000); no convergence-dependent early exit → platform-stable."

