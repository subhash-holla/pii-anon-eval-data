# ── AX-pii-anon-002 — deterministic-reproducible-generation (THE LOAD-BEARING ONE) ──
axiom_AX_pii_anon_002:
  status: UPHELD
  what_checked: >
    Bootstrap must be byte-reproducible via a LOCAL random.Random(seed), never the module-global
    RNG; McNemar must be RNG-free (deterministic by construction).
  evidence:
    - "paired.py:140 — `rng = random.Random(seed)` is a LOCAL instance; the only draw is `rng.randrange(n)` (line 147) off that local rng. No `random.seed`, `random.random`, `random.sample`, `random.choice` anywhere."
    - "AST guard (reviewer re-ran statically over the real source): all `random.<attr>` accesses == ['Random'] only; banned-module intersection {time,uuid,datetime,secrets} = empty. Matches test_fr_002_nfr004_paired_imports_no_uncontrolled_nondeterminism."
    - "Runtime invariance (reviewer re-ran): result is byte-identical under caller `random.seed(0)`, `random.seed(999999)`, AND a 1234-draw perturbation of the global stream mid-flight → proves the module-global RNG is provably never consulted."
    - "Same seed (42) twice → as_dict() equal; different seed (7) → endpoints differ (-0.10,0.28) vs (-0.12,0.26)."
    - "McNemar (mcnemar_exact / mcnemar_chi2) imports/uses no RNG → deterministic; reproduced exact p-values bit-for-bit (see AX-003)."
  ax_guard_present: true     # tests/test_paired.py:127-159 (AST) — confirmed real and passing
  runtime_guard_present: true # tests/test_paired.py:92-98 (global-RNG invariance) — confirmed real and passing

# ── AX-pii-anon-003 — stated-statistical-power / statistical rigor ──
axiom_AX_pii_anon_003:
  status: UPHELD
  what_checked: >
    McNemar over discordant pairs is the correct PAIRED test (vs CI-overlap); every result
    carries a NAMED method (NFR-002); the two-gate distinction (FR-002 detector-regression gate
    vs NFR-018 corpus-power gate) is respected.
  evidence:
    - "Correct paired test: McNemar conditions on the discordant pairs (b,c) over the SAME gold spans (paired bootstrap resamples pair INDICES preserving A/B pairing, paired.py:121-124,145-148) — not a CI-overlap heuristic. Aligned with sampling-design.md §3.2 two-gate distinction cited in module docstring (paired.py:1-19)."
    - "Named method on EVERY result (NFR-002): McNemarResult.method ∈ {mcnemar-exact, mcnemar-chi2-continuity, mcnemar-chi2}; Interval.method == 'paired-bootstrap'. Verified at runtime; round-trips via as_dict()."
    - "Two-gate distinction respected: paired.py is the MEASUREMENT side of the FR-002 detector-regression gate; it contains NO reference to the lattice / validate.py --lattice / wilson / clopper / reid corpus-power path (NFR-018). It only PAIRS WITH the design-time sizer power.py::required_discordant_pairs (named in docstring) without merging gates. grep confirms zero lattice/validate/wilson/clopper coupling."
    - "Math honesty (reviewer recomputed independently): mcnemar_exact(10,0).p_value == 0.001953125 == 2·C(10,0)·0.5^10 ✓; statistic==min(b,c)==0.0 ✓. mcnemar_chi2(20,10): χ²==(|10|-1)²/30==2.7 ✓, p==erfc(sqrt(2.7/2))==0.10034824646229071 ✓ (≈0.1003). continuity=False → χ²==100/30==3.3333… ✓. mcnemar_exact(5,5).p_value==1.0 (symmetric) ✓. b+c==0 → (statistic 0.0, p 1.0) for both ✓. odds_ratio==b/c, None when c==0 ✓."
  no_bare_point_scores: true  # this module is the test/CI machinery itself; the NFR-018 per-slice n+Wilson requirement lives in the corpus/validate path, correctly out of this module's scope.

# ── AX-pii-anon-001 — synthetic-only-no-real-pii ──
