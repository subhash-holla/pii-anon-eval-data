    name: determinism / byte-reproducibility (AX-002)
    triggered_by: "attack() is the headline RRS attacker; MUST be byte-reproducible (no RNG/clock)"
    status: UPHELD
    evidence:
      - "AST import-purity guard test_fr_007_nfr004_offline_adversary_imports_no_nondeterminism bans {random,time,uuid,datetime,secrets} via ast.walk over Import/ImportFrom — PASS."
      - "INDEPENDENT AST scan (reviewer-run): offline_adversary top-level imports = [__future__, base, collections, dataclasses, signals]; banned_hit=[]. The signals dependency itself imports only [__future__, re, statistics]; banned_hit=[] — so the determinism warrant is transitively clean, not just first-hop."
      - "test_fr_007_attack_is_deterministic: two attack() calls on identical (targets,candidates,|C|) -> g1==g2 (frozen-dataclass equality == byte-equal) — PASS."
      - "test_fr_007_ranking_is_order_independent: forward == reversed == shuffled candidate orderings — PASS."
      - "INDEPENDENT permutation probe (reviewer-run): all 6 candidate permutations -> exactly 1 distinct output repr. Stronger than the test's 3 orderings."
      - "Order-independence MECHANISM verified in source: attack() does sorted(candidates, key persona_id)[:|C|] BEFORE scoring (line 223), so even |C|-truncation is order-invariant; ranking loop uses strict 'sim > best_sim' over a persona_id-ascending pool, so ties keep the lexicographically-smallest persona_id == the (sim desc, persona_id asc) total order §8b mandates."
      - "Tie-break DIRECTION verified (reviewer-run): two equal-sim personas p-aaa/p-bbb -> winner p-aaa in BOTH forward and reversed input order (persona_id asc, not input-first)."
    severity: n/a

