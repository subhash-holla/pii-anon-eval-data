  - axiom: reidx-01
    name: target side = post-anonymization signal only (NOT gold behavioral_signals)
    triggered_by: "the load-bearing SME-panel defect-avoidance invariant for the headline adversary"
    status: UPHELD
    evidence:
      - "_target_feature_weights(target, candidate, config) (lines 134-151) sources signal features from target.observed_signals ONLY; QI features are candidate QI value strings tested for survival as case-insensitive substrings of target.anonymized_text. The gold Persona.behavioral_signals of the target's own source is never referenced on the target path."
      - "_candidate_feature_weights (lines 122-131) correctly DOES read the candidate's gold behavioral_signals + quasi_identifiers — that is the real-side pool the adversary searches, which the prompt confirms is correct."
      - "DECISIVE reviewer-run proof: a target whose anonymized_text is fully scrubbed of signal+QI ('[REDACTED] ... discussed [REDACTED] ...') does NOT link to its true source p-boston — it scores 0.43 to an unrelated persona on a residual writing-style artifact. A gold-leak would have forced score 1.0 to p-boston. Conversely, when QI 'Beacon Hill' survives into the anonymized text, the link correctly fires to p-boston (0.64) via candidate-QI substring match. This empirically separates 'reads post-anon signal' from 'reads gold'."
      - "assemble_paired_set (S3-01, read for context) builds Target.observed_signals = signals.extract(anonymized_text) — re-extracted, never copied from gold — consistent with the adversary's contract."
    severity: n/a

