    name: purity — stdlib-only; intra-package imports limited to {signals, base}
    triggered_by: "story DoD + §8b 'Pure-stdlib'"
    status: UPHELD
    evidence:
      - "offline_adversary.py imports: stdlib (__future__, collections.abc.Sequence, dataclasses.dataclass) + intra-package '..signals' (UNIQUENESS_WEIGHT, SignalsBlock) and '.base' (Guess, Persona, Target). No third-party, no network, no LLM, no I/O. Matches the 'only signals/base from the package' bound exactly."
      - "Export edits (adversary/__init__.py, scoring/__init__.py) add only typing.Any / collections.abc.Sequence + re-exports — no nondeterministic import introduced."
      - "ruff check (executor) + reviewer pytest green corroborate; no [tool.ruff] config gaps affect owned files."
