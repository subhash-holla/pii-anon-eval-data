findings:
  - id: coverage-S3-02-01
    severity: OBSERVATION
    location: dev-assist-artifacts/04-development/02-stories/sprint-3/S3-02.md:29
    description: |
      FR-007 attribution is sound BECAUSE OF a design revision — recording the
      provenance so the sprint/MUST-coverage gate carries it correctly. The source
      catalog text for FR-007 (functional-requirements.md:17 — "MUST — headline")
      specifies a "version-pinned LLM adversary" and the full measured deliverable
      ("empirical re-id recall AND precision (with Wilson CIs) … RRS = 1 − recall×
      precision reported, with |C| as a stated parameter"). S3-02 builds a
      DETERMINISTIC OFFLINE adversary, not the literal "LLM adversary." That is NOT
      an over-claim: SME finding reidx-01 (sme-heuristic-findings.md:10, a
      CATASTROPHIC verdict, resolved) reclassified the RRS headline to
      "Headline RRS = deterministic offline adversary + exposure-index; LLM-adversary
      = version-stamped SECONDARY," folded into the implementation-ready design
      (D-implementation-ready-design.md:99, reidx-01). S3-02 §2/§4 cite reidx-01
      explicitly and §4 keeps provisional_status AGENT_SIMULATED (not DIVERGED). So
      the headline-adversary slice of FR-007 IS legitimately this story; only the
      *measured scoring* slice (recall/precision/RRS + Wilson CIs over the paired set)
      remains open. Recording so the S3 sprint snapshot tracks FR-007 as still-OPEN
      with S3-04 as the successor carrying the measured-RRS acceptance evidence.
    suggested_resolution: |
      No change for this story. At the S3 sprint gate, list FR-007 as covered-by
      {S3-02 (deterministic offline adversary, this story), S3-04 (measured
      recall×precision + Wilson CIs + |C|-parameterized RRS)} and confirm the
      reidx-01 LLM→offline headline reclassification is reflected in the
      traceability matrix so the "LLM adversary" literal in FR-007 is not read as
      an unmet acceptance clause.
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-007
      - dev-assist-artifacts/03-design/06-synthesis/sme-heuristic-findings.md
      - dev-assist-artifacts/03-design/06-synthesis/D-implementation-ready-design.md

  - id: coverage-S3-02-02
    severity: OBSERVATION
    location: tests/test_offline_adversary.py:187
    description: |
      Acceptance-coverage completeness note on the FR-010 "lower precision" clause
      (non-blocking; correctly scoped). §7 "And a distractor-augmented variant is
      available, version-distinguished in adversary_id" is fully backed:
      test_fr_010_distractor_variant_distinct_id_and_lower_precision pins
      adversary_id == "offline-deterministic-v1+distractor:web-like-distractors-v1"
      vs the base "offline-deterministic-v1", and asserts |C| grows (len(aug) >=
      len(cands)). The "lower precision" half is asserted as
      int(distractor_correct) <= int(base_correct) — a NON-STRICT bound that the
      story honestly scopes: §6 item 6 says "≤ precision" and §8b states the
      deterministic lexicographic tie-break "can resolve to a decoy → a correct
      guess is no longer guaranteed; the distractor variant's correctness is ≤ the
      base variant's." It does NOT claim a measured precision DROP — measured
      precision is FR-007's recall×precision deliverable, explicitly deferred to
      S3-04. So this is correct scope, not an under-claim of the variant's existence.
      Recording so the S3-04 coverage check verifies a measured precision decrement
      under decoys is exercised where the RRS numbers are actually computed.
    suggested_resolution: |
      No change for this story. Track at the S3-04 (FR-007 measured RRS) gate: a
      test demonstrating the distractor-augmented variant yields measurably lower
      precision (recall×precision) than the base variant on the paired set, closing
      the strict-decrement half of the FR-010 "≥ candidates, ≤ precision" property.
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-010
      - dev-assist-artifacts/04-development/02-stories/sprint-3/S3-02.md#7

