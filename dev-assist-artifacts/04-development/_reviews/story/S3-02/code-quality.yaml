findings:
  - id: code-quality-S3-02-01
    severity: OBSERVATION
    location: tests/test_offline_adversary.py:184-187
    description: |
      test_fr_010_distractor_variant_distinct_id_and_lower_precision uses a "precision proxy"
      that includes `guessed_persona_id == "t-boston"` in the base_correct check. This is a
      target_id ("t-boston"), not a persona_id — the base adversary will never guess a
      target_id, so the `or` branch is vacuously dead. The correctness logic still works because
      the base case correctly resolves to "p-boston" (the real persona_id) and the distractor
      case resolves to "d-boston-1" (lexicographic winner among tied decoys), producing
      base_correct=True and distractor_correct=False. The test passes and the property holds —
      but the dead branch obscures intent.
    suggested_resolution: |
      Simplify the base_correct check to `base_guesses[0].guessed_persona_id == "p-boston"`.
      This removes the dead `"t-boston"` branch and makes the assertion's intent transparent.
      Non-blocking; raise to MINOR in a future lint-hardening story if desired.

