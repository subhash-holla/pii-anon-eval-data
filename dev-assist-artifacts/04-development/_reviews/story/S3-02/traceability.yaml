findings:
  - id: traceability-S3-02-01
    severity: OBSERVATION
    title: "test_fr_010 precision assertion OR-compares guessed_persona_id against a target_id literal"
    location: tests/test_offline_adversary.py:184-186
    detail: >
      In test_fr_010_distractor_variant_distinct_id_and_lower_precision the base/distractor
      correctness proxies OR-compare guessed_persona_id against "t-boston" (a TARGET id) as well as
      "p-boston" (the candidate id). A guessed_persona_id can only ever be a candidate persona_id,
      so the "t-boston" disjunct is structurally dead -- the assertion still holds via the "p-boston"
      disjunct and the FR-010 token + version-stamp contract it pins are sound, so this is NOT a
      traceability defect. Flagged for code-quality's correctness lane (name-vs-assert alignment is
      intact; the dead disjunct is a clarity/precision-proxy smell, not a tracing error).
    source_reviewer_handoff: code-quality

  - id: traceability-S3-02-02
    severity: OBSERVATION
    title: "DC-07 cited in docstring indirectly via reidx-01 rather than the literal token DC-07"
    location: src/pii_anon_datasets/scoring/adversary/offline_adversary.py:9,23
    detail: >
      The module docstring cites FR-007 and FR-010 by literal token but references DC-07 only
      through its design-revision handle "reidx-01" (the DC-07 headline revision), not the literal
      "DC-07" string. Traceability is intact (reidx-01 is unambiguously the DC-07 revision per
      D-implementation-ready-design.md L99, and the adversary/__init__.py package docstring L1 does
      carry the literal "DC-07"), so this is informational only. Adding the literal "DC-07" token to
      the module docstring would make a future grep-for-DC-07 audit fully self-contained.

