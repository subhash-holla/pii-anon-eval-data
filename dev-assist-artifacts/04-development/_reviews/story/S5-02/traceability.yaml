    severity: OBSERVATION
    title: NFR-012 cited in test docstrings but not in the production module/package docstrings
    detail: >-
      The production symbols (parquet_export.py, distribution/__init__.py) cite
      FR-024, gov-02, FR-022, NFR-004, AX-001 — but NOT NFR-012 by id. The
      NFR-012 loadability id appears only in the test layer
      (test_nfr_012_parquet_loads_via_datasets + the test module docstring
      "loads via HF datasets (nfr_012)"). The realization itself is correct
      (datasets in the [distribution] extra; loadability test passes), so trace
      integrity is intact via the tokened test. Optional: add an "NFR-012
      loadability via HF datasets" mention to export_parquet's docstring to make
      the production-side cite explicit. Non-blocking.
    files:
      - src/pii_anon_datasets/distribution/parquet_export.py
    requirement: NFR-012
  - id: TRACE-S5-02-OBS-02
    severity: OBSERVATION
    title: Story §3 names NFR-005-adjacent as supporting but ships no nfr005-tokened test
    detail: >-
      Story §3 lists "NFR-005-adjacent (regime columns legally distinct)" as a
      supporting requirement. The dispatch's declared tokens are fr_024/nfr_012/
      nfr004 only, and the no-merged/legally-distinct guarantee is inherited from
      and asserted in S5-01 (test_fr_022_no_merged_or_equivalence_column); S5-02's
      test #1 re-asserts the no-blob structural property. So the NFR-005-adjacent
      intent is covered transitively, not by a dedicated nfr005 token in this
      story. No action required at story gate; noted for sprint-gate coverage
      bookkeeping.
    files: []
    requirement: NFR-005

