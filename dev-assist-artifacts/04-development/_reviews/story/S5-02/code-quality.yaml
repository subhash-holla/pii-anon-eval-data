      created_by into the Parquet footer metadata, so raw bytes differ across runs/versions
      even for identical logical content. Table.equals compares logical content only.
      This matches §6 test #5 explicit specification ("compare the table contents not raw
      bytes"). JSON-encoded nested blocks use sort_keys=True; no clock/RNG touched. Sound.

