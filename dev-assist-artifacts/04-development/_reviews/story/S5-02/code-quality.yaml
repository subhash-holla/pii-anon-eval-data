findings:
  - id: code-quality-S5-02-01
    severity: OBSERVATION
    location: tests/test_parquet_export.py:33
    description: |
      _synthetic_records() is annotated `list[dict]` (bare dict, no type parameters). The
      nested generator in test_fr_024_export_streams_not_materializes is annotated
      `Iterator[dict]` (line 167). Under mypy --strict these trigger [type-arg] errors.
      The mypy --strict scope per §10/§12 is `src/pii_anon_datasets/distribution/*.py`
      only; test files are not covered. This is consistent with all prior stories in this
      codebase. Not a blocking concern.
    suggested_resolution: |
      If mypy --strict coverage is extended to the test suite in a future sprint, replace
      `list[dict]` with `list[dict[str, object]]` and `Iterator[dict]` with
      `Iterator[dict[str, object]]`. Additionally, annotate pytest fixture parameters
      (tmp_path: pathlib.Path, monkeypatch: pytest.MonkeyPatch). No action required now.

  - id: code-quality-S5-02-02
    severity: OBSERVATION
    location: src/pii_anon_datasets/distribution/parquet_export.py:151-153
    description: |
      In the zero-records code path, the schema is obtained via:
        empty_schema = pa.Table.from_pylist([], schema=_empty_schema(pa)).schema
      _empty_schema(pa) already returns a pa.Schema object; the intermediate
      pa.Table.from_pylist([], schema=...).schema extraction is redundant — the
      returned .schema attribute is the same object passed in. Harmless; does not
      affect correctness, type safety, or the gov-02 column contract.
    suggested_resolution: |
      Simplify to:
        writer = pq.ParquetWriter(out_path, _empty_schema(pa))
      and remove the intermediate empty_schema variable and Table construction.
      No behavioral change; reduces one unnecessary allocation.

