    test_file: tests/test_parquet_export.py
    coverage_module: pii_anon_datasets.distribution.parquet_export
    coverage_line_pct: 85.45
    coverage_line_stmts: 55
    coverage_line_missed: 8
    coverage_threshold_pct: 85
    tests:
      - name: test_fr_024_parquet_has_n_separate_regime_columns
        type: INTEGRATION-TEST
        result: pass
        maps_to: "§7 Then (each regime its own typed column); §7 Negative (no flattened blob); §6 #1; CRITICAL(a)"
      - name: test_fr_024_parquet_roundtrips_records
        type: INTEGRATION-TEST
        result: pass
        maps_to: "§7 Then (round-trippable); §6 #2"
