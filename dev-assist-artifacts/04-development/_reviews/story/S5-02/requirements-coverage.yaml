scope_summary: >-
  S5-02 delivers the Parquet slice of FR-024 (MUST) with the gov-02 fix (N separate
  typed reg_* regime columns, no flattened regulatory_domains blob) and NFR-012-adjacent
  HF-datasets loadability. All six §6 tokened tests in tests/test_parquet_export.py
  PASS on independent re-run (6 passed in ~1.5s; pyarrow 23.0.1 + datasets 4.8.3
  genuinely installed, so the INTEGRATION/loadability tests RAN — not stubbed). Full
  suite 223 passed, 1 skipped on independent re-run — 0 regressions, exactly matching
  the §10/§12 claim (217 prior + 6 new; pre-existing skip unchanged). Independently
  measured line coverage on pii_anon_datasets.distribution.parquet_export = 85.45%
  (55 stmts, 8 missed) — meets the >=85% line bar. Each §7 G/W/T clause + each negative
  clause maps to a passing assertion. The 4 CRITICAL checks (a) 5 reg_* cols + no blob,
  (b) HF datasets load with regime cols surviving, (c) one-shot-generator streaming,
  (d) >=85% line coverage are all independently verified.

scope_note_for_sprint_gate: >-
  FR-024 is a MUST spanning JSONL + Parquet + Croissant + spaCy + CoNLL + dataset card.
  S5-02 covers ONLY the Parquet slice (correctly scoped; Croissant -> S5-03, CLI export
  verb -> S5-05 per story §5). After S5-02: the FR-024 Parquet sub-clause is VERIFIED and
  NFR-012 HF-datasets loadability of the Parquet artifact is VERIFIED; gov-02 (MAJOR SME
  finding, sme-heuristic-findings.md:29) is fully closed for the export surface. NOT YET
  covered by FR-024 overall: Croissant validate+load (the literal NFR-012 threshold names
  the Croissant file; S5-03), spaCy/CoNLL exports, dataset card. provisional_status
  AGENT_SIMULATED (not DIVERGED) -> no Pass-2 DIVERGED cross-check applies; a Pass-2
  real-CI re-run is scheduled (I/O-bound, no special hardware) and is appropriate.

