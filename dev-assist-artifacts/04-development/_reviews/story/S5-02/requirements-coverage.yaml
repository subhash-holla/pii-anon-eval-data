verification_runs:
  target_tests:
    cmd: "python3 -m pytest tests/test_parquet_export.py -q"
    result: "6 passed"
    deps_present: { pyarrow: "23.0.1", datasets: "4.8.3" }
  full_suite:
    cmd: "python3 -m pytest"
    result: "223 passed, 1 skipped"
    regressions: 0
    matches_story_claim: true
  coverage:
    cmd: "coverage run --source=pii_anon_datasets.distribution.parquet_export -m pytest tests/test_parquet_export.py"
    line_pct: 85.45
    stmts: 55
    missed: 8
    threshold_pct: 85
    meets_bar: true
    note: >-
      The combined branch-inclusive Cover column reads 81%, but NFR-016 scopes BRANCH
      coverage to scoring/stats only (pyproject [tool.coverage.run] source = scoring,stats;
      branch=true). The distribution package's bar is LINE coverage, which is 85.45%
      ((55-8)/55). Missed lines (65,122,133,144-145,151-154,168) are defensive/edge paths:
      JSON None-block branch, batch_size<=0 ValueError, empty-batch flush early-return, the
      mid-stream batch-flush-at-threshold (tests use 4 records < default 10_000 batch_size),
      and the zero-records empty-Parquet path (_empty_schema). None of these are the load-bearing
      gov-02 / streaming / loadability behaviors, all of which ARE covered.

findings:
  - id: RC-S5-02-01
    severity: OBSERVATION
    title: "Line coverage clears the bar but by a thin 0.45-pt margin; edge paths uncovered"
    detail: >-
      Line coverage is 85.45% (55 stmts, 8 missed) vs the >=85% bar — PASS, but with little
      headroom. The 8 missed lines are the batch-flush-at-threshold path (144-145: tests pass
      only 4 records, well under the default batch_size=10_000, so the multi-batch streaming
      loop never iterates a second batch) and the zero-records empty-Parquet path
      (148-154,168 / _empty_schema). The streaming CONTRACT is still proven dynamically by
      test #4 (one-shot generator driven to exhaustion), and the gov-02 empty-schema columns
      are asserted indirectly via as_columns({}). Out-of-scope to require here (test-design is
      code-quality's call), but a future test driving batch_size=2 over 4 records (to exercise
      a real second batch flush) and one exporting [] (empty corpus) would harden the
      streaming + empty-file guarantees and lift branch coverage. Non-blocking.
    location: "src/pii_anon_datasets/distribution/parquet_export.py:144-145,148-154,168"
  - id: RC-S5-02-02
    severity: OBSERVATION
    title: "NFR-012 literal threshold also names the Croissant file (S5-03) — sprint-gate carry"
    detail: >-
      NFR-012's text is 'Croissant file validates AND loads via the HF datasets loader'. S5-02
      verifies the Parquet artifact loads via datasets (genuinely ran), which satisfies the
      loadability spirit for the Parquet export, but the Croissant-validate-and-load half is
      S5-03's surface. Recording so the sprint gate does not prematurely mark NFR-012 fully
      satisfied on S5-02 alone. No defect in S5-02; correct scoping.
    location: "dev-assist-artifacts/02-requirements/non-functional-requirements.md:28; story §5"

