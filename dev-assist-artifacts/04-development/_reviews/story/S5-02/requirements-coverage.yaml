        result: pass
        maps_to: "§7 Given/Then (streamed, no full materialization); §6 #4; CRITICAL(c)"
      - name: test_fr_024_deterministic_export
        type: PROPERTY-TEST
        result: pass
        maps_to: "§7 Then (deterministic load); §6 #5"
  nfr_012:
    requirement: "NFR-012 — HF datasets loadability (Parquet artifact loads via the datasets loader, not mere presence)"
    priority: MUST
    status: verified
