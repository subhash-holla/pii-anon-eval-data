notes:
  - "False-determinism trap (pyarrow footer kv-metadata stamping lib version + created_by) is correctly identified and avoided by asserting Table.equals over the logical table rather than raw bytes. In this reviewer's re-run the two files happened to be byte-identical too, but the test does not depend on that — the contract is logical-table equality, which is the correct (and stricter-than-necessary) choice."
  - "gov-02 is enforced in DEPTH: the no-merge discipline is structurally guaranteed at the S5-01 crosswalk SSOT (frozen dataclass + module-level assert) and S5-02 merely projects those 5 ordered keys into Parquet columns + drops the source blob — there is no place in the exporter where regimes could be re-merged."
  - "Empty-record path (_empty_schema) still emits a valid Parquet file advertising the 5 reg_* columns and no regulatory_domains blob — gov-02 holds even on the zero-record corpus."

