    pii_shaped_literals: none             # regex sweep: zero email/@.com, zero SSN \d{3}-\d{2}-\d{4}, zero IBAN, zero PAN/phone, zero honorific/First-Last name, zero PEM/AKIA/sk-/ghp_/xox token
    detail: >
      Labels like "user_prompt"/"tool_call"/"log_sink"/"model_output"/"presidio" are pipeline/
