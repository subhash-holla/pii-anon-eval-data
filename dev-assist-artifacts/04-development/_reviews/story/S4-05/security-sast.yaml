summary: >
  S4-05 ships the DC-09 D3 visualization layer: five static-PNG report renderers (reliability
  diagram, two-axis privacy-utility Pareto, slice heatmap delegating to PowerMatrix.heatmap,
  agent-leakage flow bars, and the FR-005 abstention coverage-risk curve) behind a NEW optional
  [viz] extra. All dispatch-named checks pass. NFR-004 (lazy import): an independent AST sweep of
  viz.py finds ZERO module-level matplotlib imports — the only two `import matplotlib` lines both
  sit inside _require_matplotlib (which selects the Agg backend), so `import
  pii_anon_datasets.reporting` (which re-exports the fns) stays stdlib-only at load; the in-tree
  AST guard + the import-sabotage package-import test corroborate, and a missing extra raises a
  clear RuntimeError naming the install command. DEPENDENCY SURFACE: matplotlib is the ONLY new
  dependency, declared as `viz = ["matplotlib"]` under [project.optional-dependencies] (commit
  8c5c820, confirmed via git -S); it is opt-in (the core declares no install_requires), NOT
  git-pinned (registry-resolved, catalog #10 clean), permissively licensed (no GPL), and per the
  dispatch a new transitive-CVE concern is NOT flagged at this story gate (full pip-audit/SBOM
  scan is an epic/release activity). No other dependency/lock manifest is touched. ARBITRARY-WRITE
  SURFACE: every savefig()/delegated heatmap() receives the caller-supplied `path` verbatim with
  no validation — but this is an INTERNAL report-gen API invoked in-process by trusted builder
  code, not a remote/CLI surface, and the path is not interpolated/templated; recorded as a single
  OBSERVATION (validate/anchor the path IF ever wired to an externally-influenced filename) — no
  current breach. No dangerous sinks (AST + grep: no eval/exec/__import__/subprocess/os.system/
  pickle/marshal/yaml.load/socket/requests/urllib/httpx/secrets); no hardcoded credential or weak
  hash (no hashlib at all); deterministic (Agg + figure-close; no random/time/uuid/datetime). AX-001
  holds: test fixtures are synthetic duck-typed CalibrationResult bins, Pareto (risk,utility,label)
  tuples, LeakageEdge tuples, and confidence/correct arrays — labels like "user_prompt"/"tool_call"
  are pipeline identifiers, not PII; zero PII-shaped or credential literals across all owned files;
  the lone tomllib read in the test targets the project's own pyproject. No capability, trust-boundary,
  HSM, composition-root, egress, or unsafe edge (pure Python). Zero MAJOR+ (one informational
  observation) -> APPROVE.
