  unsafe_block_added: false               # Python; n/a — no ctypes/cffi/FFI either

verification:
  lazy_matplotlib_import_nfr004:          # PRIMARY dispatch concern
    status: pass
    method: ast.parse + walk over viz.py (independent of, and matching, test_nfr004_viz_no_toplevel_matplotlib_import)
    toplevel_imports_viz_py: ["__future__.annotations", "collections.abc.Sequence", "dataclasses.dataclass", "typing.Any"]
    toplevel_matplotlib_import_lines: []  # ZERO module-level matplotlib import
    matplotlib_import_sites: ["viz.py:54 `import matplotlib`", "viz.py:57 `import matplotlib.pyplot as plt`"]
    matplotlib_imports_all_inside_fn: "_require_matplotlib"   # AST-confirmed: the ONLY two matplotlib imports both sit in this function body
    detail: >
      matplotlib is imported lazily ONLY inside _require_matplotlib (which also calls
      matplotlib.use("Agg") before importing pyplot). Defining the render fns needs no
      matplotlib; only CALLING one does.
  reporting_core_imports_without_matplotlib_nfr004:
    status: pass
    detail: >
      reporting/__init__.py re-exports the 5 viz fns + LeakageEdge via `from .viz import ...`,
      which is import-safe without matplotlib (viz.py top-level is stdlib-only). The in-tree
      test_nfr004_reporting_core_imports_without_matplotlib proves it by sabotaging the
      matplotlib import (monkeypatched builtins.__import__) and still importing the package.
  single_new_optional_dependency:
    status: pass
    new_dependency: "matplotlib"
    declared_as: 'viz = ["matplotlib"]'        # [project.optional-dependencies]
    behind_extra: true
    git_pinned: false                          # no `git = "..."` / VCS URL — registry-resolved (catalog #10 clean)
    version_pinned: false                      # bare `matplotlib` (no ==/>= pin) — acceptable for an OPTIONAL viz extra at story gate; transitive-CVE scan explicitly deferred per dispatch
    other_runtime_deps_added: none             # the [project] core declares no install_requires; viz is opt-in
    cve_surface: >
      Per dispatch, new transitive-CVE concern is NOT flagged at this story gate (matplotlib is a
      mainstream, actively-maintained plotting lib behind an opt-in extra; full CVE/SBOM scan is an
      epic/release-gate activity via pip-audit). No CVE adjudication performed or required here.
  pyproject_change_is_only_viz_extra:
    status: pass
    detail: >
      The S4-05-attributable pyproject change is the single `viz = ["matplotlib"]` line (commit
      8c5c820). The larger optional-dependencies block + version bump + pytest/coverage config
      visible in `git diff main -- pyproject.toml` are PRIOR-story cumulative branch state, not
      this story's diff. No other dependency/lock manifest (requirements*/poetry.lock/Pipfile/
      setup.py/setup.cfg/Cargo*) is touched anywhere in the branch.
  no_dangerous_sinks:
    status: pass
    method: ast.walk Call/Import over viz.py + __init__.py (+ grep corroboration)
    confirmed_absent: ["eval", "exec", "compile", "__import__", "input", "os.system", "subprocess.*", "pickle.*", "marshal.*", "yaml.load", "shelve", "socket", "requests", "urllib", "httpx", "ftplib", "smtplib", "secrets", "ctypes", "cffi", "shutil", "tempfile", "hashlib"]
    detail: production files import only stdlib (collections.abc/dataclasses/typing/__future__) + the lazy matplotlib; no dynamic-exec, network, deserialization, or secrets surface.
  no_secrets_or_weak_crypto:
    status: pass
    detail: >
      No hardcoded credential/api-key/token/password/PEM literal (catalog #8 clean); no md5/sha1
      or any hashlib use (catalog #15 n/a — no hashing at all). regex + AST literal sweep across
      all owned files -> zero hits.
  arbitrary_write_path_surface:           # dispatch ask — render fns write to caller-supplied `path`
    status: pass
    severity: observation                 # NOT a finding — internal API, no remote/untrusted caller
    method: ast — every savefig()/heatmap() arg0 is the caller-supplied `path` Name (no concat/derivation)
    write_sites: ["viz.py:100 fig.savefig(path)", "viz.py:125 fig.savefig(path)", "viz.py:162 fig.savefig(path)", "viz.py:206 fig.savefig(path)", "viz.py:136 power_matrix.heatmap(path) (delegated write)"]
    path_validation_present: false
    assessment: >
      `path` is passed verbatim to matplotlib.Figure.savefig (and to PowerMatrix.heatmap) with no
      sanitization. If a caller supplied an attacker-controlled path this would be a classic
      path-traversal / arbitrary-write. HOWEVER this is an INTERNAL report-generation API invoked
      in-process by trusted report-builder code with a path the builder itself constructs — it is
      NOT a remote/network/CLI-arg surface, and the dispatch explicitly frames the path as
      caller-supplied internal. No injection (no f-string/format into the path; the value is the
      bare argument). Recorded as an OBSERVATION (note that if these fns are ever wired to a route
      that accepts an externally-influenced filename, the path should be validated/anchored to an
      allowed output dir) — no current breach, no MAJOR+.
  no_real_pii_ax_001:                     # AX-001 + hooks.sensitive_data_scan
    status: pass
    test_data_shape: >
      synthetic duck-typed CalibrationResult bins (conf_mean/acc/count floats+ints); Pareto
