    location: tests/test_viz.py:217
    description: |
      `test_fr005_pyproject_declares_viz_extra` uses the token style `fr005` (no underscore
      separator) while the other 8 tests consistently use `fr_005` / `nfr_003` / `nfr004`
      (mixed, but the Pareto and agent-leakage tests use the canonical `fr_NNN` form with
      underscore). Story §6 specifies tokens `fr_005` / `nfr_003` / `fr_006`. A strict grep
      for `fr_\d{3}` would not match this name. The FR-005 intent is clear from context; this
      is a stylistic inconsistency across the 9 tests, not a functional gap.
    suggested_resolution: |
      Rename `test_fr005_pyproject_declares_viz_extra` to
      `test_fr_005_pyproject_declares_viz_extra` to match the canonical `fr_NNN` underscore
      token style used by the other 8 tests and specified in story §6. No logic change required.

