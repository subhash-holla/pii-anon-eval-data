  - id: axiom-S6-04-05-01
    severity: OBSERVATION
    location: GOVERNANCE.md:67
    description: |
      The CoI section claims the held-out gold labels are "never distributed and
      are structurally excluded from the store." The "structurally excluded from
      the store" half is fully substantiated in code: LeaderboardStore.append
      rejects the forbidden payload keys {gold, gold_labels, held_out,
      held_out_labels, answers, ground_truth} (store.py:55-58, 143-145) — i.e. a
      forbidden-key reject, exactly as the doc states. The "never distributed"
      half is a governance/process commitment about the held-out split (it has no
      single code site to pin, and none in scope contradicts it). This is NOT an
      over-claim — flagging only so a future reviewer reads "never distributed" as
      a process promise rather than a code-enforced guarantee.
    suggested_resolution: |
      No change required. Optionally, a one-clause footnote distinguishing the
      code-enforced part (forbidden-key reject in the store) from the process
      part (the held-out split is not published) would make the epistemic warrant
      even crisper, but the current wording is honest as written.
    references:
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-001
      - src/pii_anon_datasets/leaderboard/store.py

