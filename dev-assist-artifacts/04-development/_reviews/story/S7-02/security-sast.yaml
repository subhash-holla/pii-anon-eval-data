  AX-001 INERT invariant — the crux — all five sub-criteria CONFIRMED:

  1. NO WEAPONIZED CONTENT (PASS). grep of payloads.py for the mandated set
     (ignore previous|<script|eval(|exec(|os.|subprocess|system(|__import__|jailbreak) returned
     ZERO matches; an extended sweep (b64decode|pickle|marshal|compile(|getattr|setattr|globals|
     locals|requests|urllib|socket|http) also ZERO. The only hits anywhere are the inert-marker
     STRING LITERALS inside the AX-001 audit test itself (test_payloads.py:101 weaponized_markers
     tuple), which is the test asserting their ABSENCE — correct, not a violation. The 3 transforms
     only OBFUSCATE a PII span: base64_transform (b64ENCODE), ocr_transform (fixed _OCR_MAP literal
     substitution, no unicodedata lookup), zero_width_transform (U+200B join). Carriers are inert
     "<prefix>: {span}" templates (Please note / Nota / Remarque / Hinweis / 注意 / ملاحظة). These
     are detector-robustness FIXTURES, not prompt-injection attacks.

  2. render() IS A PLAIN STRING (PASS). render() is `self.carrier_template.format(span=...)` —
     str.format on a literal template with a single named field; no f-string eval, no active/
     callable/code-object content. test #4 asserts isinstance(rendered, str). as_dict() likewise
     returns a plain dict of strings.

  3. NON-STRIPPABLE INERTNESS DISCLAIMER (PASS). INERT_DISCLAIMER (payloads.py:57-60) states
     "Inert" + "NOT a weaponized prompt injection (no active/executable content)" + "NEVER marketed
     as agent-leakage scoring". It is a module constant AND a validated dataclass field whose
     __post_init__ (L95-96) raises ValueError on empty/whitespace — a scope-misrepresentation guard
     that cannot be silently dropped. test #4 pins empty -> ValueError and asserts the
     inert/never/agent-leakage tokens. Mirrors the gate-approved S7-01 ORACLE_DISCLAIMER pattern.

  4. base64 USE IS BENIGN (PASS). Sole base64 call is base64.b64encode(span.encode("utf-8")) —
     ENCODE for obfuscation. NO b64decode of untrusted input, NO eval/exec/pickle/marshal after a
     decode, NO unsafe deserialization in the module. (The lone b64decode is in test #3, decoding
     the library's OWN output to prove the transform is faithful — a round-trip assertion, inert.)

  5. NO REAL PII (PASS). Transforms operate on caller-supplied synthetic spans; the only span in
     module/tests is the fabricated "Robin Vale" (and "0BFU5C8TED"). Regex sweep for real-PII
     shapes (SSN ddd-dd-dddd / 13-16-digit card / email / 10+-digit phone) across module + tests:
     ZERO matches.

