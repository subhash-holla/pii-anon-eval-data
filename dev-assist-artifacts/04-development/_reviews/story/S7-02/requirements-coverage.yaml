findings:
  - id: coverage-S7-02-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/scoring/adversary/payloads.py:152
    description: |
      FR-017 qualifies the payloads as "(multilingual/obfuscated)". The library DOES ship
      6 multilingual carriers (CARRIER_TEMPLATES: en/es/fr/de/ja/ar, lines 103-106), but
      build_payloads(span) defaults to carrier=CARRIER_TEMPLATES[0] (English "Please note:")
      and no test in tests/test_payloads.py asserts the multilingual property — the 5
      non-English carriers are never exercised. The "multilingual" sub-clause of FR-017's
      payload half is implemented-but-untested. Every other payload-library sub-clause
      (tuple shape, 3 committed transforms, faithful, inert, validation, pure-stdlib) has a
      named passing test. Non-blocking: FR-017 is a SHOULD and DC-10 is a bounded COULD;
      the carrier-substitution mechanism itself is covered by the tuple/render test.
    suggested_resolution: |
      At or before the S7 sprint gate, add one assertion (or a parametrized test) that
      build_payloads(span, carrier=...) accepts a non-ASCII carrier and that
      CARRIER_TEMPLATES spans >1 language, so the FR-017 "multilingual" sub-clause carries
      explicit test evidence before FR-017 is marked verified at the sprint gate.
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-017

