  ── AX-004 / NFR-005 — metric-family SEPARATION (the load-bearing crux) — HELD ──────────────────────
  The two evidence families are kept as two SEPARATE as_dict keys and are structurally unmergeable.
  Independently confirmed (not via the story's own test, re-derived here):
    * EndStateBundle.as_dict() keys == {anonymization_evidence, pseudonymization_evidence,
      regulatory_crosswalk, disclaimer}. The two evidence sub-objects are distinct dicts; the
      forbidden merged-name set {combined, overall, overall_score, deid, de_identification_score,
      score} is disjoint from the as_dict keys.
    * NO __float__: `hasattr(EndStateBundle, "__float__")` is False AND `float(bundle)` raises
      TypeError at runtime on a real two-axis instance ("float() argument must be a string or a real
      number, not 'EndStateBundle'") — the bundle cannot collapse to a single de-id scalar.
    * Dataclass fields == {regulatory_crosswalk, anonymization_evidence, pseudonymization_evidence,
      disclaimer}; `_FORBIDDEN_MERGE_NAMES.isdisjoint(field_names)` is True. The module-bottom
      `assert _FORBIDDEN_MERGE_NAMES.isdisjoint({f.name for f in fields(EndStateBundle)})` enforces
      this at IMPORT time (fail-fast structural guard) — verified to execute on import.
    * AST + raw-grep of end_state_bundle.py: the six merged-verdict names appear ONLY in (a) the
      module/class docstrings that document their DELIBERATE absence and (b) the
      `_FORBIDDEN_MERGE_NAMES` guard frozenset itself — NEVER as a defined symbol (0 FunctionDef /
      AnnAssign / Assign targets) and NEVER as an attribute access (0 ast.Attribute `.attr` matches).
      So the guard names are inert data, exactly as required.
    * Pseudo collision integers stay separate downstream: as_dict carries `intended_linkage_collisions`
      + `unintended_crypto_collisions` and NO `total_collisions` (the FR-012 moat is not re-summed by
      the bundle). The bundle nests the scorers' own as_dict verbatim and never re-projects.
    This mirrors — at the composition layer — the SAME structural separation the sibling scorers already
    enforce within their own modules: scoring/anonymization.py::ParetoPoint (privacy MeasuredRRS vs
    utility UtilityScore, no __float__, no combined field) and scoring/pseudonymization.py::
    PseudonymizationReport (two collision integers never summed, no utility/residual_risk/combined/deid
    field). The bundle is faithful to the family-separation discipline at the layer that would be most
    tempting to fuse, and the crosswalk sibling (compliance/crosswalk.py) likewise carries no merged
    "compliant" verdict — so AX-004 holds end-to-end across the compliance surface.
    Test `test_nfr_005_bundle_has_no_merged_verdict` PASSES (`pytest -k nfr_005 -q` → 1 passed).

