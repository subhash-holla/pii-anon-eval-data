      Re-run line-only coverage on pii_anon_datasets.stats.intervals is 81% (CP tests alone)
      / 83% (with Wilson tests); project-canonical branch coverage is 83%. None reach the
      brief's '≥85% line'. The deficit is NOT in S4-01's claimed behavior: every uncovered
      line is either pre-existing S1 Wilson code (_z Winitzki L58-62, wilson n=0 sentinel L69
      — §8 says PRESERVE) or a defensive numerical guard in _betacf/_betainc/_inv_betainc that
      is unreachable on the normal CP path. No MUST behavior is unverified.
    must_refs: []
    location: "src/pii_anon_datasets/stats/intervals.py"
    recommendation: >
      Either (a) add 2 micro-tests hitting the _betainc x<=0 / x>=1 and _inv_betainc p<=0/p>=1
      guards (cheap, pushes line coverage past 85), or (b) reconcile the story/brief to state the
      threshold is project-canonical branch coverage (83%, no fail_under gate) rather than 85% line.
      Non-blocking at a story gate.
  - id: RC-S4-01-002
    severity: MINOR
    title: "Story does not name the coverage mode backing its threshold"
    detail: >
      §10 DoD and §12 evidence cite coverage qualitatively but do not state line-vs-branch.
      The brief asks for '85% line'; pyproject sets branch=true. Naming the mode would remove the
      apparent (but immaterial) mismatch.
    must_refs: []
    location: "dev-assist-artifacts/04-development/02-stories/sprint-4/S4-01.md §10/§12"
    recommendation: "State 'branch coverage (NFR-016), no fail_under gate' explicitly."

