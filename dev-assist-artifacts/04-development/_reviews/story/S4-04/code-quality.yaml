  - id: code-quality-S4-04-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/reporting/language_power.py:21
    description: |
      `_power_class` is imported from `.power_table` which is a private symbol (underscore-prefixed).
      This is intentional (mirroring the power_table.py discipline as specified in §8b) and there is
      no public re-export. The reuse is correct and load-bearing, but future callers cannot rely on
      this symbol being stable. The current story scope makes no claim of public stability for this
      helper, so this is non-blocking.
    suggested_resolution: |
      No action required for this story. If `_power_class` is needed by a third module in a future
      story, promote it to a public symbol in `power_table.py` with a docstring at that time.

