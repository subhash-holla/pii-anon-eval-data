summary: >
  S4-03 adds the calibration measurement surface of DC-09/FR-005: Expected Calibration Error
  (equal-width bins, pinned idx=min(n_bins-1,int(conf*n_bins))), the Brier score, and a per-bin
  reliability tuple, computable per entity class. The dispatch's load-bearing checks all pass.
  PURE-STDLIB (NFR-004): an independent AST import extraction yields exactly {__future__,
  collections.abc, dataclasses, statistics, typing} — no numpy/scipy, no network (socket/requests/
  urllib/httpx), no eval/exec/compile/__import__, no subprocess, no pickle/marshal/yaml, no secrets,
  no filesystem/open(). Unlike S4-02 this story introduces NO randomness at all (no random/secrets),
  so there is no RNG/crypto surface and no weak-primitive question. The in-tree AST import-purity
  guard (test_fr_005_nfr004_calibration_imports_no_nondeterminism) is present and statically pins out
  {random,time,uuid,datetime,secrets}; this reviewer reproduced its clean result. AX-001 holds: the
  API consumes only confidence floats + correctness ints (+ entity_type as an opaque label), the test
  fixtures carry zero PII-shaped literals (no email/SSN/PAN/name/key), and PERSON/EMAIL/X are synthetic
  entity-class tokens. calibration_by_entity_class reads caller-supplied in-process Mapping records ONLY
  (AST call set {append,calibrate,cast,float,int,setdefault,str}) — no corpus load, no file read, no
  real-PII ingestion path; the lone pathlib.read_text in the test targets calibration.py's own source
  for the guard. Float-domain crash-safety is runtime-verified: n=0 short-circuits to 0.0 before any
  division, empty bins are guarded (continue / empty-Bin branch), conf==1.0 clamps to the last bin via
  min(), n_bins=1 and single-record/empty-records classes are all safe — zero exceptions on any
  degenerate path; the SOLE intentional raise is len-mismatch -> ValueError, and NFR-008's high-ECE is
  REPORTED via meets_reference (never gated/raised). The REFACTOR cast()/zip(strict=True) changes are
  INERT: typing.cast is a runtime no-op (return val) and zip(strict=True) is redundant with the existing
  _check_lengths guard, so runtime behaviour is identical to GREEN. No capability, trust-boundary, HSM,
  composition-root, or egress edge (pure numeric Python); no new dependency -> no CVE/SBOM surface; no
  DoS/hang (zero while-loops, all loops finite and reached only by trusted in-process callers). Zero
  findings at any severity -> APPROVE.
