independent_verification:
  ece_recompute:
    method: "independent re-implementation of equal-width ECE (idx=min(n_bins-1,int(conf*n_bins))); implementation NOT trusted"
    fixed_input:
      conf: [0.05, 0.15, 0.25, 0.35, 0.85, 0.95, 0.95, 1.00]
      correct: [0, 0, 1, 0, 1, 1, 1, 0]
    computed: 0.29375           # 0.29374999999999996 == approx(0.29375, abs=1e-12)
    story_and_test_claim: 0.29375
    match: true
    note: "dense bin9 (0.95,0.95,1.00): count3 acc 2/3 conf_mean 2.9/3 gap 0.3 weight 3/8 contrib 0.1125 — confirmed"
  brier_recompute:
    method: "independent mean((conf-correct)**2)"
    computed: 0.2171875
    story_and_test_claim: 0.2171875
    match: true
  ancillary_recompute:
    perfect_calibration_ece: 0.0          # claim 0.0 — match
    person_ece: 0.0
    person_brier: 0.1875                  # claim 0.1875 — match
    email_ece: 0.9
    email_brier: 0.81                     # claim 0.81 — match

  nfr_008_reported_not_gated:
    honesty_check: PASS
    evidence:
      - "Only `raise` in calibration.py is ValueError on len(confidences)!=len(correct) (line 103) — no raise/block on high ECE"
      - "calibrate() on high-ECE input (0.29375) RETURNS a CalibrationResult; meets_reference == False; surfaced via property + as_dict()"
      - "EMAIL class (ece 0.9) still returns a result — badly-calibrated class reported, not gated"
      - "test_nfr_008_meets_reference_is_reported_not_gated asserts no-raise + flag False + live comparison (good→True)"
    note: "NFR-008 is REPORTED (reference target), not a submitter pass/fail — load-bearing honesty property holds end-to-end"

  coverage_calibration_py:
    target_module: pii_anon_datasets.stats.calibration
    command: "python3 -m pytest tests/test_calibration.py --cov=pii_anon_datasets.stats.calibration --cov-report=term-missing"
    stmts: 93
    missed: 2
    line_coverage_pct: 97.8        # (93-2)/93 — comfortably >= 85% line requirement
    branch_coverage_pct: 96
    missing_lines: [128, 154]
    missing_lines_nature: "empty-input early returns (n==0 -> 0.0) in expected_calibration_error & brier_score; not calibration logic — acceptable to miss"
    meets_85_line: true

  test_execution:
    calibration_suite: "8 passed in 0.13s"
    collected: 8
    full_suite: "192 passed, 1 skipped in 2.37s"
    regressions: 0
    matches_story_claim: true        # story claimed 192 passed / 1 pre-existing skip

