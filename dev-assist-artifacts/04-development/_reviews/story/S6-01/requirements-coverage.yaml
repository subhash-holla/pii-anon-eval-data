    location: dev-assist-artifacts/04-development/02-stories/sprint-6/S6-01.md:35
    description: |
      FR-023 (MUST, UC-11 neutral leaderboard) is a MULTI-PART requirement
      (functional-requirements.md:43): "held-out labels stay undistributed; a
      published submission policy + anti-gaming control (rate-limit / held-out
      rotation / contamination check) + opt-in publish + private dry-run pre-score
      + config/version attestation + per-slice strengths." S6-01 deliberately
      implements only the held-out STORE slice (gold-undistributed + provenance/
      attestation logged + tamper-evidence). It correctly does NOT claim FR-023
      fully closed (story §3 "Primary: FR-023 ... the gold stays undistributed";
      §5 names S6-02 = policy/anti-gaming/opt-in-publish, S6-03 = CoI). The
      deferred sub-parts are therefore deferred-WITH-named-successor — the bar at
      a STORY gate. NOTE for the epic/sprint gate: the named successors S6-02 and
      S6-03 currently exist ONLY as in-prose references inside S6-01 (§3 gov-03
      seam, §5 Blocks). No S6-02.md / S6-03.md story file exists yet
      (sprint-6/ holds only S6-01.md) and the dev-log S6 row is still "TODO"
      (development-log.md:16). So the *residual FR-023 sub-parts are not yet
      tracked on any board outside this single story*. Acceptable at the narrow
      story gate (successor is named); flagged so the epic/sprint coverage gate
      authors the successor stories and records the FR-023 deferral delta before
      S6 closes. This is the standard finding-pattern #1 ("a planned bar has no
      story claiming it") raised proactively one gate early — NOT a blocker here.
    suggested_resolution: |
      No change required in S6-01. At the S6 epic/sprint gate: create the
      S6-02 (anti-gaming control: rate-limit / held-out rotation / contamination
      check + opt-in publish + private dry-run pre-score) and S6-03 (CoI /
      affiliation recusal) story files, and record in the traceability matrix /
      dev-log that FR-023's leaderboard-STORE slice closed in S6-01 while the
      policy + CoI slices remain OPEN against those named successors. FR-023 must
      not be marked DONE until S6-02 + S6-03 verify the anti-gaming + CoI halves.
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-023
      - dev-assist-artifacts/02-requirements/traceability-matrix.md#UC-11

