  - id: code-quality-S3-08-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/stats/power.py:133
    description: |
      ReidTier (str, Enum) has no explicit class-level docstring — the class body begins
      immediately with enum members. The runtime __doc__ is the Python default "An enumeration."
      The two member-level inline comments (# p_ref=0.30, d=0.030 → 897 pairs ...) do convey
      the semantic meaning, and the pre-existing Tier enum follows the identical pattern, so this
      is consistent house style rather than a new omission introduced by S3-08.
    suggested_resolution: |
      No action required for story gate approval. If the team ever adopts a
      "Enum must have explicit class docstring" policy, add a one-liner above the first
      member: '"""Re-id operating-point power tiers (sampling-design.md §5; NFR-018)."""'
    references:
      - sampling-design.md#5

  - id: code-quality-S3-08-02
    severity: OBSERVATION
    location: src/pii_anon_datasets/stats/power.py:139
    description: |
      ReidTierSpec dataclass has no explicit class-level docstring. The fields are
      self-documenting (tier, p_ref, half_width, target_n_pairs) and the class is fully
      typed and frozen. The pre-existing TierSpec, CellAudit, and PowerMatrix dataclasses
      follow the identical no-class-docstring pattern. Consistent house style, not a new
      omission from this story.
    suggested_resolution: |
      No action required for story gate approval. Add a one-liner docstring
      '"""Frozen spec for a re-id power tier."""' if the team adopts a stricter doc policy.

