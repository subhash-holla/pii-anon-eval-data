  ### Lazy-import circular-cycle analysis (disclosed deviation from §8b)
  §8b originally specified top-level import of ANTI_ANONYMITY_CAVEAT. The executor instead
  used a module-private _anti_anonymity_caveat() function with a lazy `from ..scoring.reidentification
  import ANTI_ANONYMITY_CAVEAT` inside its body, set as the `default_factory` for
  ReidProvenance.caveat.

  Soundness confirmed on three dimensions:
  1. Cycle-free at load time: importing pii_anon_datasets.stats does NOT trigger import of
     pii_anon_datasets.scoring — verified live: `'pii_anon_datasets.scoring' not in sys.modules`
     after `import pii_anon_datasets.stats`. stats remains a leaf subsystem.
  2. Canonical value: the lazy helper returns the identical object as the top-level constant.
     `prov.caveat == ANTI_ANONYMITY_CAVEAT` confirmed True (same string, not a redefinition).
  3. Non-strippable: __post_init__ rejects any ReidProvenance whose caveat.strip() is empty,
     so the FR-009 guarantee holds even if the default_factory were replaced — confirmed by the
     pytest.raises(ValueError) assertion in test #3.

  The deviation is sound. The `default_factory` pattern is the idiomatic Python resolution
  for deferred constant capture within frozen dataclasses.

