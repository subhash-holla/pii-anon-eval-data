  S-PWR FROZEN-lattice guardrail. All four axiom obligations are upheld and
  independently verified. AX-pii-anon-004 / NFR-005 (anon + pseudo never merged)
  is now genuinely checkable ACROSS both modules: tests #6/#7 are AST + live-
  introspection anchored (not naive substring greps), confirm anonymization.py
  (ParetoPoint: residual_risk + utility, no __float__) and pseudonymization.py
  (PseudonymizationReport: two SEPARATE collision ints, explicitly no
  total_collisions) define no merged-metric public symbol, neither imports the
  other's result type, and scoring.__all__ exposes no fused de-id/combined/
  overall callable. AX-pii-anon-003 / NFR-018: the re-id ladder is DERIVED from
  the NIST closed form (reid_required_n(0.30,0.030)==897, (0.10,0.030)==385 —
  independently recomputed; REID_TIER_SPECS round-trips via test #2, never hand-
  typed) and ReidProvenance carries |C| (candidate_set_size), the re-id tier, and
  a NON-STRIPPABLE caveat reusing the canonical FR-009 ANTI_ANONYMITY_CAVEAT
  (rejected empty by __post_init__; serialized by as_dict; attaches to
  MeasuredRRS + rides score_reidentification). S-PWR guardrail (CRITICAL):
  confirmed via git diff that eval_lattice.json / lattice_freq_snapshot.json /
  corpus are UNTOUCHED across all 3 story commits; build_committed_lattice /
  write_lattice are not called; the reid seam is code-only; regression guard
  test #5 pins cell_count == len(cells) == 730 (verified against the live file).
  AX-pii-anon-002 / NFR-004: the seam is additive — detection Tier / required_n /
  TIER_SPECS / PowerMatrix / CellAudit / audit_crossing blocks are byte-identical
  before vs after (verified by per-anchor byte-compare; the one initial
  CHANGED flag was a false positive from a fixed-window heuristic — target_for_tier
  is byte-identical). The lazy default_factory import-cycle fix is SOUND: stats
  imports no scoring symbol at module-load time (leaf subsystem preserved), the
  caveat resolves to the canonical constant at construction, and non-strippability
  is independently enforced by the __post_init__ guard. Pure-stdlib. Owned tests
  7/7 green; full suite exit 0 (167 passed, 1 pre-existing skip, 0 regressions).
  Zero MAJOR+ findings.

