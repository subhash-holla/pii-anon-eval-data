axioms_in_scope:
  - id: AX-pii-anon-004
    name: anonymization-pseudonymization-separation
    traced_to: [NFR-005, AX-004]
    status: upheld
    evidence: >
      tests/test_nfr005_separation.py #6/#7. _defined_names() walks the AST and
      ignores docstring/comment/string-literal prose, so the deliberate disclaimer
      mentions of 'combined'/'deid'/'total_collisions' (present in both module
      docstrings) do NOT trip the audit while a DEFINED public symbol would. Teeth
      confirmed: checks (a) definition-anchored source grep of BOTH module sources,
      (b) live module namespaces (catches re-export), (c) absence of __float__ and
      forbidden attributes on ParetoPoint + PseudonymizationReport, (d) the two
      collision integers stay separate with 'total_collisions' NOT in the
      dataclass fields, (e) scoring.__all__ exports no fused-named symbol and the
      two family entry points return DISTINCT result types (anon_ret != pseudo_ret).
      Independently re-ran: scoring.__all__ fused-named exports == NONE;
      score_anonymization + score_pseudonymization both present. Cross-module
      no-merge is now genuinely enforceable because S3-06 + S3-07 both exist.
  - id: AX-pii-anon-003
    name: stated-statistical-power
    traced_to: [NFR-018]
    status: upheld
    evidence: >
      reid_required_n routes through the same required_n / _z closed form (one
      z-table, two semantic entry points). Independently recomputed via
      statistics.NormalDist inv_cdf: (0.30,0.030)->897 and (0.10,0.030)->385 —
      exact match; detection ladder also reproduces 1522/753/200. REID_TIER_SPECS
      targets are DERIVED (target_n_pairs == reid_required_n(spec.p_ref,
      spec.half_width) for every tier — test #2 round-trip; the 897/385 in trailing
      comments are documentation only, not literals baked into the table).
      ReidProvenance records candidate_set_size (|C|), reid_tier, adversary_id
      (reidx-01), powered == (observed_pairs >= target_n_pairs), and a caveat that
      __post_init__ rejects when blank and as_dict always serializes.
  - id: AX-pii-anon-002
    name: deterministic-reproducible-generation
    traced_to: [NFR-004]
    status: upheld
    evidence: >
      Pure-stdlib (only dataclasses.field added; the FR-009 caveat is a lazy intra-
      package import inside a default_factory — no third-party dependency). Detection
      Tier / required_n / TIER_SPECS / target_for_tier / PowerMatrix / CellAudit /
      audit_crossing / projected_* / required_discordant_pairs /
      paired_vs_independent_ratio / classify / default_tier_of verified byte-identical
      before vs after the story (per-anchor byte-compare against d9bcecb~1). The reid
      seam is strictly additive. No unseeded random/uuid/time enters record content.
  - id: AX-pii-anon-001
    name: synthetic-only-no-real-pii
    traced_to: []
    status: upheld
    evidence: >
      Not a primary axiom for this code-only stats/test seam, but scanned the 4
      owned files for real-PII heuristics (SSN-shaped, Luhn/card-shaped, real-email):
      NONE. Test fixtures use synthetic identifiers (adversary_id
