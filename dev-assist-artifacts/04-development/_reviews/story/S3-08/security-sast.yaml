  each made the audit FAIL, while disclaimer prose mentioning the forbidden names correctly
  passes (AST-anchored, not substring). The reid power-ladder seam is code-only and inert —
  zero file I/O on import/construct, the FROZEN eval_lattice.json (730 cells) is untouched in
  code and in git, and the import-cycle resolution uses a static lazy `from ... import` with no
  eval/exec/dynamic-import surface. The ReidProvenance anti-anonymity caveat is non-strippable
  (FR-009) and pure-stdlib (NFR-004) holds with no new dependency. No real PII (AX-001). Zero
  MAJOR+ findings → APPROVE.
