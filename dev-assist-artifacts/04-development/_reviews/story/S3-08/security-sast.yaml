primary_control:
  name: "NFR-005 / AX-004 cross-module no-merge audit ([AUDIT]; tests #6/#7)"
  classification: privacy-integrity control
  proves_separation: true
  teeth_independently_verified: true   # sandboxed mutation testing on temp copies; real tree never edited
  teeth_evidence:
    - vector: "merged field/property `combined` (+ __float__) on ParetoPoint"
      result: "test_nfr_005_anon_and_pseudo_are_separate_modules FAILS — assert not {'combined'} (line 83; AST source-grep + live-namespace catch)"
    - vector: "fused callable combined_deid_score()->float exported in scoring.__all__"
      result: "test_nfr_005_no_combined_deid_callable_in_scoring_public_api FAILS — 'scoring.__all__ exports a fused-de-id-named symbol' (line 115)"
    - vector: "summed `total_collisions` property on PseudonymizationReport"
      result: "FAILS — assert not {'total_collisions'} (line 83; field/hasattr guard at lines 97/104)"
    - vector: "anon imports the other family's result type (PseudonymizationReport) — cross-module fusion"
      result: "FAILS — assert not hasattr(anon, 'PseudonymizationReport') (line 74)"
  prose_tolerance_correct: true   # forbidden names in disclaimer docstrings/comments are ALLOWED (AST-anchored, not naive substring) — verified: 12 such prose mentions across the 2 modules, audit ignores them
  structural_unmergeability_confirmed:
    - "ParetoPoint axes are different types (MeasuredRRS vs UtilityScore); no __float__; no merged field/property"
    - "PseudonymizationReport keeps intended_linkage_collisions / unintended_crypto_collisions SEPARATE; no total_collisions"
    - "neither module re-exports the other's result type; scoring.__all__ has no fused-token export; score_anonymization vs score_pseudonymization return distinct types"

