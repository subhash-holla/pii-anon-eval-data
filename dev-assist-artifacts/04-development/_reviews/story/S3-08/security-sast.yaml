summary: >
  The [AUDIT]-tagged NFR-005/AX-004 cross-module no-merge control genuinely proves the
  anonymization and pseudonymization metric families are never fused into a combined de-id
  score, and it has real TEETH: independent sandboxed mutation across four fusion vectors
