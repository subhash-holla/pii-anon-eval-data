findings:
  - id: axiom-S3-01-01
    severity: OBSERVATION
    location: tests/test_signals.py:test_detect_signals_pure_and_deterministic
    description: |
      AX-002 determinism. The purity/determinism test asserts intra-process
      idempotence (det(text) == det(text); extract(text) == extract(text)) but
      does not by itself foreclose a shared seeded-RNG/clock side channel — two
      calls in one process could agree yet still be nondeterministic across
      processes. The axiom still holds: independently confirmed there is zero
      clock/RNG/IO in the owned files (no random/secrets/uuid/time/datetime
      import or call; the only "time" tokens are the word "timezone" in
      comments), every detect_* is a pure regex/string function of `text`, and
      a 100-run extract() loop is byte-identical. So the spirit is fully upheld;
      only the test's stated warrant lags its claim ("no RNG/clock") — the
      property is proven by construction + the cross-process experiment, not by
      the assertion. Form-lags-spirit only; non-blocking.
    suggested_resolution: |
      Optional hardening (not required to clear the gate): add a one-line
      assertion that the owned modules import none of {random, secrets, uuid,
      time, datetime} (e.g. assert no such name in
      vars(signals)/sys.modules-delta), or assert extract() equals a frozen
      golden block so the no-RNG claim is mechanically pinned rather than
      inferred. Track in S3-02+ if convenient.
    references:
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-002
      - dev-assist-artifacts/04-development/02-stories/sprint-3/S3-01.md#6

