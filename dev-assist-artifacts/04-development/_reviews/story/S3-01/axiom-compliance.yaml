  ── AX-002 deterministic-reproducible-generation (AX-pii-anon-002) — PASS ──
  • assemble_paired_set is sort-based: substrate.sort(key=lambda r: r["record_id"])
    then slice — no RNG, no clock, no set-iteration leak into output. Test #4
    (test_assemble_paired_set_deterministic) has real teeth: input order is
    ["ccc-3","aaa-1","bbb-2"] but it asserts the assembled order is the SORTED
    ["aaa-1","bbb-2","ccc-3"] AND equality across two runs — would fail if the
    assembler preserved insertion order or used a set/dict-keyed dedup.
  • Persona/Target/Guess are frozen dataclasses (@dataclass(frozen=True));
    Test #1 proves FrozenInstanceError on mutation.
  • signals.extract is a pure function of text: detect_* are regex/string ops;
    indicator lists are built by in-order append over insertion-ordered dict
    catalogues (no set->list ordering leak); compute_signal_density iterates a
    dict in insertion order. Independently ran extract() 100x → byte-identical.
  • Grepped owned files for {random, secrets, uuid, time, datetime, urandom,
    perf_counter, monotonic}: NONE (only the word "timezone" in comments).
    Determinism is airtight by construction, not merely by the passing test.

  ── reidx-01 de-circularization (LOAD-BEARING) — PASS (independently proven) ──
  Verified BOTH by reading assemble_paired_set §3-4 and by a direct data-level
  experiment, not by trusting the test assertion:
  • Code path: Target.observed_signals = signals.extract(anonymized_text), where
    anonymized_text = record["context_preservation"][f"anonymized_{variant}"].
    Persona.behavioral_signals = record["tier3_evaluation"]["behavioral_signals"]
    (gold) is assigned to the Persona ONLY — it is NEVER read into the Target.
    There is no aliasing and no copy of gold into observed_signals anywhere.
  • Empirical proof (gold says location=very_high "the T/Beacon Hill"; the
    pseudonymized variant strips it to "commute downtown"):
        GOLD  location uniqueness : very_high   |  OBS location uniqueness : none
        GOLD  density             : 0.93        |  OBS density             : 0.2433
        observed IS gold (alias)? : False       |  observed == gold?        : False
    The two genuinely diverge in BOTH object identity and value; gold is left
    unmutated. Test #7 (test_target_observed_signals_reextracted_not_gold)
    faithfully guards exactly this. This is the exact SME-flagged defect
    (downstream RRS collapsing into the precomputed heuristic) and it is closed.
  • Strengthening note: the documented Deviation #1 — detect_professional_domain
    defaulting record_domain="general" inside extract() — actually REINFORCES
    reidx-01: it removes a record-metadata side channel so the adversary's view
    is a function of anonymized TEXT ALONE. Correct call, not a violation.

