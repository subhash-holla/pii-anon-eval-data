    description: |
      Scope-classification nuance (non-blocking). §3 labels FR-010 the "Primary"
      traced requirement, and the story title frames it as the requirement being
      "established". In the source requirements catalog, FR-010 is a **SHOULD**
      (functional-requirements.md:20 — "UC-05, N3; SHOULD"), whereas FR-007 and
      FR-008 — the two reqs listed as SUPPORTING here — are the **MUSTs** (lines
      17–18). So at the sprint/MUST-coverage gate the load-bearing MUSTs this story
      *touches* are FR-007 and FR-008, and the deliverable here is correctly only
      the PORT they will consume (Adversary Protocol + assemble_paired_set + the
      ported signals.py substrate), not their full implementation. The story makes
      exactly this disclaimer ("No adversary implementation yet … only the contract
      + the data plumbing"; §3 SUPPORTING note; §8b "that script becomes a thin
      caller in a LATER cleanup, NOT this story"). No over-claim — recording only
      so the sprint-gate MUST-coverage snapshot tracks FR-007/008 as still-OPEN
      (their full G/W/T — 2,500-pair measured recall×precision with Wilson CIs for
      FR-007; the explicit pre-screen-vs-RRS correlation report for FR-008 — is
      deferred-with-successor to S3-04/S3-05, which §5 names as the consumers).
    suggested_resolution: |
      No change required for this story. At the S3 sprint gate, ensure the
      MUST-coverage snapshot lists FR-007 (S3-04) and FR-008 (S3-05) as the
      successor stories carrying the full acceptance evidence, and treats S3-01
      as supplying only their shared port substrate.
    references:
