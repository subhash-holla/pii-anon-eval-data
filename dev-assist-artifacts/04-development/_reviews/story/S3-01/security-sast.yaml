  AX-001 (no-real-PII) — PRIMARY axiom, VERIFIED CLEAN on three independent grounds:
    1. assemble_paired_set reads NO corpus itself. It is a pure in-memory transform over a
       caller-supplied `records: Sequence[Record]` argument -> frozen dataclasses + re-extracted
       signals. It does NOT call load_dataset, open(), json, or any ingestion primitive. The
       "reads only the synthetic corpus" requirement is satisfied structurally: there is no read
       path in scope to point at a real-PII source. Whatever the caller passes in is the only data
       surface, and selection is sort-by-record_id + slice (no transform that could synthesize PII).
    2. Zero I/O of any kind. AST-level import audit of all 3 src modules: every import is stdlib
       (re, statistics, dataclasses, typing, collections.abc, __future__) or in-package relative.
       No socket/urllib/requests/httpx/http.client/ftplib/smtplib (NO network egress), no open/
       Path/read_text/read_bytes (no filesystem), no os.environ/getenv (no secret pull). Egress
       surface for this story = none.
    3. Tests use inline synthetic fixtures (tiny dicts; synthetic names Alice/Bob/Carla/Dana/
       Robin/Sam) — they do NOT touch load_dataset or any real corpus path. This is MORE
       conservative than §6's described "<=200-record load_dataset slice"; no real-PII can enter
       the test path either.

  signals.py inertness (regex/keyword extractor) — VERIFIED:
