findings:
  - id: code-quality-S5-03-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/distribution/__init__.py:28-33
    description: |
      `validate_with_mlcroissant` is NOT exported from the package __init__ `__all__`.
      Story §8 MODIFIED clause lists only `build_croissant`, `validate_croissant`,
      `build_dataset_card` as required exports — so the omission is compliant with the
      story contract. However, the function is part of the public API of `croissant.py`
      (has a full docstring) and callers would need to import it via its submodule path.
      This is an observation only; no contract is broken.
    suggested_resolution: |
      No action required for this story. If a future story (e.g. the CLI export verb in
      S5-05) needs `validate_with_mlcroissant` to be importable from the top-level
      package, add it to `__all__` and the import line at that time.

