findings:
  - id: code-quality-S5-04-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/integrations/conll_format.py:64-65
    description: |
      Two `# type: ignore[call-overload]` suppressions are present in `_assign_bio_tags`
      at lines 64-65 on `int(ann["start"])` and `int(ann["end"])`. These are justified:
      `ann` is typed as `Mapping[str, object]`, so subscript lookup yields `object`, and
      `int(object)` has no matching overload under mypy --strict. Confirmed by stripping
      the suppression and re-running mypy, which fires two `call-overload` errors. The
      suppressions are minimal, locally scoped, and necessary for the broad `Mapping[str,
      object]` contract (matching the brownfield port discipline and the spaCy exporter's
      analogous `Any` pattern). No action required.
    suggested_resolution: |
      No action required. If a future story narrows the annotation schema to a typed
      dataclass or TypedDict, these suppressions will become unused-ignore errors under
      --strict and can be removed at that time.

