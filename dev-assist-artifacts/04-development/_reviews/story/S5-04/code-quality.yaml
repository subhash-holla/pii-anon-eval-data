  ### §12 deviations — verified non-weakening
  Deviation 1 (CoNLL doc separator = one blank line): The verbatim-ported `record_to_conll`
  ends each record on exactly one trailing `\n`; `export_conll` writes one extra `"\n"` between
  records — the boundary is `\n\n` (one blank line), the same shape as between-sentence. Test #3
  asserts the exact byte form (`"line\tO\n\nGamma\tO"`) and proves the separator exists and has
  the right count. No contract weakened; the test is tighter, not looser.
  Deviation 2 (no `# type: ignore[import-untyped]` on `import spacy`): spaCy 3.8.x ships
  `py.typed`, so the suppression would be an unused-ignore under `--strict`. Removing it is
  required for a clean `mypy --strict`. The comment in `_require_spacy` documents the reasoning
  (lines 50-52). No contract weakened; the type contract is cleaner.

