findings:
  - id: axiom-S5-04-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/distribution/conll_export.py:46
    description: |
      The inline comment `f.write("\n")  # double blank line between documents`
      describes the EXTRA separator write, but the literal effect is a SINGLE
      "\n" appended between two records that each already end on a blank line —
      yielding one blank line at the doc boundary (verified: live output ends
      `line\tO\n\nGamma\tO`), the same shape as the inter-sentence separator,
      NOT two blank lines. The story §8b "Deviation 1" already documents this
      (verbatim-ported `record_to_conll` ends each record on one trailing "\n";
      keeping the verbatim impl was the discipline-correct call). The comment
      is carried over from the brownfield CLI and is now slightly misleading.
      NO axiom is affected: AX-002 determinism holds (byte-identical across two
      live runs, sha 9b855ba36299) and the thin-wrap invariant holds. This is a
      comment-accuracy nit, logged for code-quality, not an axiom breach.
    suggested_resolution: |
      Optional (non-blocking): retune the comment to "extra blank-line separator
      between documents (one written newline; record_to_conll already ends each
      record on a blank line)" so the prose matches the single-"\n" write.
    references:
      - dev-assist-artifacts/02-requirements/non-functional-requirements.md#NFR-004
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-002

