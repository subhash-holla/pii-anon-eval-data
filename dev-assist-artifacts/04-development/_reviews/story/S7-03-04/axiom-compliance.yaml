    the formulaic synthetic_lattice_enrichment monoculture — honest that synthetic-distribution
    coverage is not external validity (AX-pii-anon-003: stated statistical power). Pinned by
    test_fr_015_slice_low_power_caveat_non_strippable [UNIT-TEST]. This is the form AX-003
    takes for a SHOULD/v1.1 slice that cannot meet the NIST per-cell power bar: it labels itself
    low-power/exploratory rather than presenting a bare score.
  * Correct filtering. coreference_slice keeps records with a NON-EMPTY coreference_chains
    (slices.py:62-65; empty/missing/null entity_tracking excluded); quasi_identifier_slice keeps
    records with >= min_qids quasi_identifiers, min_qids configurable and tightening (slices.py:
    68-71). Pinned by test_fr_015_* and test_fr_016_*. Faithful to FR-015/016
    (functional-requirements.md:29-30).
  * Pure-stdlib AST guard. test_nfr004_slices_pure_stdlib [PROPERTY-TEST] asserts
    {random,time,uuid,datetime,secrets} disjoint from imports; slices.py imports only
    {__future__, collections, dataclasses} — deterministic, order-preserving filter, no
    clock/RNG (AX-pii-anon-002). `python3 -m pytest tests/test_slices.py -q` -> 4 passed.

