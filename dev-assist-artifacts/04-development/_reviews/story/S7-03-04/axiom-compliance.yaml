  --- S7-03 / FR-027 (the crux is NEVER FABRICATE) — UPHELD ----------------------------------
  * Never-fabricate sentinel (epistemic-honesty invariant). Verified empirically:
    correlate([...], real_scores=None) -> RealDataAbsent; correlate([...], real_scores=[]) ->
    RealDataAbsent. Both return available=False and are asserted NOT a CorrelationResult by
    test_fr_027_returns_sentinel_when_real_data_absent [CONTRACT-TEST]. The harness refuses to
    invent a correlation when real i2b2-2014 / TAB data is absent. correlation.py:205 guard
    `if not real_scores:` covers both the None and the empty-list path. Edge case I probed:
    a single present real score [0.0] is a truthy list, so it bypasses the sentinel and
    correctly hits the >=2 ValueError (correlation.py:208-209) — it REFUSES rather than
    fabricates a degenerate correlation. Correct, not a finding.
  * Non-strippable note + caveat. RealDataAbsent.__post_init__ (correlation.py:46-48) and
    CorrelationResult.__post_init__ (correlation.py:70-72) both raise ValueError on an
    empty/whitespace string. Content verified: CORRELATION_CAVEAT contains "NOT external
    validity" + "FR-027"; REAL_DATA_ABSENT_NOTE contains "REFUSES" + "fabricate" + "FR-027".
    Pinned by test_fr_027_caveat_non_strippable [UNIT-TEST] (caveat="" and caveat="   " both
    raise; RealDataAbsent(note="") raises). The caveat truthfully states synthetic-distribution
    agreement is NOT external validity and routes the synthetic->real transfer delta to a
    real-data Pass-2 item — faithful to FR-027 (SHOULD; v1.1; Pass-2) in
    functional-requirements.md:47.
  * Seed-deterministic bootstrap (AX-pii-anon-002 / NFR-004). _bootstrap_ci (correlation.py:185)
    owns a LOCAL random.Random(seed) — never a module-global random.<fn>. The AST guard
    test_nfr004_correlation_purity [PROPERTY-TEST] (1) asserts {time,uuid,datetime,secrets}
    disjoint from imports and (2) walks every `random.<attr>` Attribute node and asserts it is
    exactly `random.Random`. Mirrors stats/paired.py:140 verbatim. test_fr_027_bootstrap_ci_
    seeded_deterministic additionally proves byte-identical CIs across two same-seed runs AND
    invariance under a perturbed module-global RNG (random.seed(0) / random.seed(999999) leave
    the result identical) — direct evidence the global RNG is never consulted. `python3 -m
    pytest tests/test_correlation.py -k fr_027 -q` -> 4 passed; `-k nfr004 -q` -> 1 passed.

  --- S7-04 / FR-015-016 (the crux is the low-power caveat) — UPHELD --------------------------
  * Non-strippable SLICE_CAVEAT (epistemic-honesty invariant for the synthetic monoculture).
    Slice.__post_init__ (slices.py:40-42) raises ValueError on empty/whitespace. Content
