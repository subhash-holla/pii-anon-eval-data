     LeaderboardStore.append(EventType.SUBMITTED, ..., payload=record.as_dict()) is accepted (the
     store's FR-023 guard at store.py:143-145 does not trip). The recusal flag is logged as provenance,
     not stripped. No held-out-gold key is carried.

  4. NO EGRESS / SECRETS / UNSAFE DESERIALIZATION / NO REAL PII — PASS. Top-level imports are exactly
     {__future__, dataclasses} (AST-confirmed). grep for network/subprocess/socket/urllib/pickle/
     marshal/eval/exec/__import__/open/os.environ/secrets/credential-shapes/md5/sha1 matched only
     docstring prose and the recusal-token literals, never an actual call or import. submitter and
     affiliation are free-text org/person identifiers (governance metadata), not corpus PII subjects;
     no held-out evaluation data flows through this module. No new dependency (pure-stdlib) -> no CVE/
     SBOM/composition-root/license surface; no capability registry, trust boundary, HSM port, or
     egress-manifest entity touched (the agentic-runtime/financial security entities do not apply to
     this benchmark repo, domain_packs: []). sensitive_data_scan is enabled at repo level; the
     no-real-PII invariant holds for this module — no SSN/ABA/API-key/PII-pattern literals present.

