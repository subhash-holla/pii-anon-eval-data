findings:
  - id: security-S6-03-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/leaderboard/coi.py:57-60
    description: |
      requires_recusal normalizes with affiliation.strip().lower() and substring-matches the literal
      "pii-anon-core". This correctly defeats the in-scope evasion vectors (verified empirically):
      casing (PII-ANON-CORE, Pii-Anon-Core), leading/trailing whitespace and tabs/newlines
      ("\tPII-Anon-Core\n", "  pii-anon-core  "), suffix ("pii-anon-core-team", "Pii-Anon-Core Labs"),
      prefix ("ex-pii-anon-core"), and punctuation suffix ("Pii-Anon-Core, Inc.") all flag True; an
      affiliated submitter cannot bypass the recusal flag by casing/whitespace/suffix manipulation.
      However, semantic-equivalence variants evade the flag (all return False): hyphen-dropped
      "piianoncore", space-separated "pii anon core", camel "PiiAnonCore", and unicode look-alikes
      (fullwidth "pｉｉ-anon-core", dotless-i "pıi-anon-core"). This is a known, deliberate limitation
      of a substring control on free-text affiliation and is explicitly out of scope for blocking at
      this gate. The recusal flag is an attested governance signal, not an adversarial authentication
      boundary — a determined affiliated submitter who would obfuscate their affiliation to dodge
      recusal is already violating the gov-03 attestation they signed. Recorded for monitoring only.
    suggested_resolution: |
      Optional hardening (NOT required to clear this gate): NFKC-normalize the affiliation before
      matching (unicodedata.normalize("NFKC", a)) to fold fullwidth/look-alike code points, and/or
      strip non-alphanumerics before the substring test so that "piianoncore" / "pii anon core" also
      match. Track as a governance-robustness follow-up; coordinate with axiom-compliance (the
      governance-neutrality invariant owner) rather than patching in-story.
    references:
      - dev-assist-artifacts/04-development/02-stories/sprint-6/S6-03.md#8b
      - requirements.md#gov-03
      - requirements.md#NFR-014

