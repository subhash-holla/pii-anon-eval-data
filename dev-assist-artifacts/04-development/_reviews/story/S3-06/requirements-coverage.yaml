    - clause: "downstream utility axis is a pinned token-preservation-v1 probe"
      covered_by: [test_fr_006_utility_probe_deterministic_and_versioned, test_fr_006_utility_perfect_preservation_and_full_mask]
      status: VERIFIED
    - clause: "two axes are separate nested objects — never merged into one number (NEGATIVE)"
      covered_by: [test_nfr005_pareto_point_cannot_merge]
      status: VERIFIED
    - clause: "no attr/property/__float__ yields a single privacy+utility scalar (NEGATIVE)"
