# ── Critical checks dispatched by the gate ──
critical_checks:
  a_residual_risk_is_measured_MeasuredRRS:
    status: PASS
    evidence: >-
      anonymization.py reimplements NO RRS internals (grep: no RRSResult / wilson_interval /
      from_attack / recall*precision arithmetic — sole match is a docstring). score_anonymization
      makes one live call score_reidentification(adversary, targets, candidates, |C|, confidence)
      at line 225, which runs adversary.attack(...). Test #5 drives the REAL
      OfflineDeterministicAdversary end-to-end and asserts adversary_id == "offline-deterministic-v1".
      reidentification.py is git-untouched by S3-06 (last commits are S3-04's GREEN/REFACTOR).
      Conclusion: the privacy axis is a genuinely MEASURED MeasuredRRS, NOT a precomputed field.
  b_utility_is_pinned_token_preservation_v1_probe:
    status: PASS
    evidence: >-
      UTILITY_PROBE_VERSION == "token-preservation-v1"; asserted in tests #1 and #3
      (UtilityScore.probe == "token-preservation-v1"). Deterministic (test #1: score_utility(x)==score_utility(x));
      perfect preservation -> 1.0 and full-mask -> <0.5 (test #2). Real Jaccard over placeholder-stripped
      content tokens — non-placeholder, deterministic, stdlib.
  c_never_merged_into_one_number_structurally_enforced:
    status: PASS
    evidence: >-
      Test #4 [AUDIT] enforces no-merge three ways: (A) hasattr introspection over
      {combined,overall,overall_score,deid,de_identification_score,deidentification_score,score}
      on instance AND class + float(point) raises TypeError (no __float__); (B) as_dict() keys are
      EXACTLY {privacy,utility,variant,note}, two distinct dicts; (C) AST grep of anonymization.py
      proves none of the forbidden names is defined as a function/field/assignment (the names appear
      only in docstrings + the PARETO_SEPARATION_NOTE prose). The two axes are nested objects of
      DIFFERENT types (MeasuredRRS vs UtilityScore); no arithmetic field fuses them. The frozen
      weights INSIDE UtilityScore combine utility COMPONENTS only — that is explicitly permitted and
      does not violate the axis-merge prohibition. FR-006 "never merged into one number" is structural.

