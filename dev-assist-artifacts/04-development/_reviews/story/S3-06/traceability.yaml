fr_006_genuinely_realized:
  claim: "residual re-id risk + utility, never merged into one number — via ParetoPoint (two typed axes)"
  evidence:
    - "ParetoPoint.residual_risk: MeasuredRRS  (privacy axis) — anonymization.py:182"
    - "ParetoPoint.utility: UtilityScore       (utility axis) — anonymization.py:183"
    - "two axes are nested objects of DIFFERENT types; no arithmetic field combining them"
    - "no __float__; no combined/overall/overall_score/deid/de_identification_score/score member"
    - "as_dict() emits two SEPARATE sub-objects {privacy, utility} + variant + note — anonymization.py:191-202"
    - "AST source grep in test_nfr005 confirms none of the forbidden merged-metric names are defined as fn/field/assign"
  result: PASS — the 'never merged' guarantee is structurally realized, not by convention.

