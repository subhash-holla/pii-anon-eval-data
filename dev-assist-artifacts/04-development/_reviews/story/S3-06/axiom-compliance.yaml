    name: anonymization-pseudonymization-separation
    role: PRIMARY  # THE key axiom for this story (NFR-005) — no privacy+utility axis fusion
    triggered_by: "story emits the anonymization metric family as a two-axis Pareto point"
    upheld: true
  - id: AX-pii-anon-003
    name: stated-statistical-power
    role: applied
    triggered_by: "privacy axis (MeasuredRRS) publishes recall/precision proportions with CIs"
    upheld: true
  - id: AX-pii-anon-002
    name: deterministic-reproducible-generation
    role: applied
    triggered_by: "scorer must be deterministic (no RNG/clock); pinned utility probe"
    upheld: true
  - id: AX-pii-anon-001
    name: synthetic-only-no-real-pii
    role: applied
    triggered_by: "test fixtures embed original/anonymized text pairs + entity values"
    upheld: true

axiom_verification:

  - axiom: AX-pii-anon-004
    claim: >
      ParetoPoint structurally CANNOT merge the privacy + utility axes: no
      combined/overall/overall_score/deid/de_identification_score/score field-or-
      property, no __float__; as_dict keeps two SEPARATE sub-objects. Frozen weights
      INSIDE UtilityScore combining utility COMPONENTS are allowed (distinction respected).
    method: grep_plus_ast_rederivation_plus_test_plus_import_scan_plus_runtime_introspection
    evidence:
      - "anonymization.py — every occurrence of {combined,overall,overall_score,deid,de_identification_score,deidentification_score,score,__float__} is a DOCSTRING/COMMENT (lines 17-18, 110, 175-176, 195) or the PARETO_SEPARATION_NOTE prose (line 48); NONE is declared as a function/property/field/assignment. Independent grep returned no member-level match; 'score' as a standalone member: none."
      - "Independent AST re-derivation (walk over FunctionDef/AsyncFunctionDef/AnnAssign/Assign) — forbidden DEFINED names leaked: NONE; numeric-coercion/arithmetic dunders {__float__,__int__,__index__,__add__,__radd__,__round__}: NONE; only dunder defined is __post_init__; properties defined: none. This re-proves test #4 step (C) independently of the test."
      - "dataclasses.fields(ParetoPoint) == {residual_risk, utility, variant, note}; the two axes are residual_risk: MeasuredRRS and utility: UtilityScore — different types (line 133 test asserts type(...) is not type(...)). hasattr(ParetoPoint,'__float__') is False; float(point) raises TypeError (runtime-confirmed)."
      - "as_dict (lines 191-202) emits exactly {privacy, utility, variant, note}; privacy nests residual_risk.as_dict() and utility nests utility.as_dict() as two distinct dicts (d['privacy'] is not d['utility']); deliberately no combined key (comment line 195). No arithmetic field anywhere fuses the axes."
      - "PERMITTED-VS-FORBIDDEN distinction respected: _W_PRESERVATION(0.60)/_W_INFO_RETAINED(0.25)/_W_COHERENCE(0.15) (lines 60-62) and the renormalised weighted mean (score_utility lines 162-167) combine utility COMPONENTS into one utility number INSIDE UtilityScore — explicitly allowed by AX-004/NFR-005 and the story §8b. No weight or sum spans the privacy axis. The executor honored the exact boundary the dispatch flagged."
      - "tests/test_anonymization.py::test_nfr005_pareto_point_cannot_merge [AUDIT] enforces (A) hasattr-false over the seven-name forbidden set on instance AND class + float() TypeError, (B) as_dict keys exactly {privacy,utility,variant,note} both dicts + forbidden.isdisjoint(keys), (C) AST source grep of the module, (D) empty-note ValueError — GREEN on independent re-run."
    result: UPHELD

  - axiom: AX-pii-anon-003
    claim: >
      The privacy axis (MeasuredRRS) carries Wilson CIs, inherited unchanged from S3-04.
    method: reused_module_field_inspection_plus_git_history
    evidence:
      - "MeasuredRRS (reidentification.py:82-123) declares reid_recall_ci: Interval and reid_precision_ci: Interval, both produced by wilson_interval(correct, n_targets/n_guesses, confidence) at lines 167-168; as_dict serializes both CIs (lines 111-112)."
      - "S3-06 calls score_reidentification(...) once (anonymization.py:225) and wraps the returned MeasuredRRS verbatim as the privacy axis; the CIs therefore travel through ParetoPoint.as_dict()['privacy'] unchanged. reidentification.py is git-untouched by S3-06."
      - "test_fr_006_residual_risk_axis_is_measured_rrs [AUDIT] drives the REAL OfflineDeterministicAdversary end-to-end and asserts the privacy axis is a MeasuredRRS (adversary_id == 'offline-deterministic-v1') — GREEN."
    notes: >
      AX-003's lattice positive-count targets (>=1522/753/200) govern CORPUS slices via
      validate.py --lattice, not unit-test fixtures; this scorer's tiny inline targets/
      candidates set yields correspondingly wide CIs by design — no conflict with the
      axiom's corpus-slice scope. The CIs are inherited, not (re)computed in the owned file.
    result: UPHELD

  - axiom: AX-pii-anon-002
    claim: >
      Determinism — no RNG/clock; pure-stdlib (re + dataclasses); AST import-purity
      guard bans {random,time,uuid,datetime,secrets} and the utility probe is pinned.
    method: import_scan_plus_ast_guard_plus_runtime_determinism
    evidence:
      - "Top-level imports of anonymization.py (independent AST scan) = {__future__, re, collections, dataclasses, adversary, reidentification}; NONE of {random,time,uuid,datetime,secrets} present (NFR-004 satisfied with stdlib re + dataclasses)."
      - "test_fr_006_nfr004_anonymization_imports_no_nondeterminism [PROPERTY-TEST] parses the module via ast with banned={'random','time','uuid','datetime','secrets'} (EXACT spec match, line 252) and asserts banned.isdisjoint(imported) — GREEN."
      - "Runtime determinism reconfirmed: score_utility(o,a) == score_utility(o,a) is True (frozen dataclass equality on identical inputs); UTILITY_PROBE_VERSION == 'token-preservation-v1' is pinned (line 44); the probe is a deterministic placeholder-stripped Jaccard with no clock/RNG."
    result: UPHELD

  - axiom: AX-pii-anon-001
    claim: synthetic-only test data; no real PII in fixtures.
    method: pattern_scan_plus_luhn_check
    evidence:
      - "Fixtures use toy names only: 'Jane Doe', 'Alice'/'Bob' (in this reviewer's runtime probe), placeholder addresses '42 Beacon Street'/'Beacon Hill', 'Boston' — generic, not a named real person paired with contact data."
      - "All numeric literals >=3 digits in test_anonymization.py are FR/NFR tokens (006/005/004/009) plus a single 4-digit toy account '1234'; Luhn check over all >=13-digit runs returns NONE — zero valid card numbers, zero ddd-dd-dddd SSNs."
    result: UPHELD

