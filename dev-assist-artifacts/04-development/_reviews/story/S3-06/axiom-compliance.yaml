summary: >
  S3-06 (anonymization privacy-utility Pareto scorer, DC-06/FR-006) holds every project
  axiom triggered by the diff. AX-004/NFR-005 (THE key axiom for this story) is upheld
  structurally, not by convention: ParetoPoint nests two value objects of DIFFERENT types
  (MeasuredRRS vs UtilityScore), declares NO combined/overall/overall_score/deid/
  de_identification_score/score field-or-property, defines NO __float__ (nor any numeric-
  coercion/__add__ dunder), and its as_dict() emits exactly {privacy, utility, variant, note}
  — two SEPARATE sub-objects, never a fused scalar. An independent AST re-derivation of the
  forbidden-name grep confirms the seven banned names occur ONLY in docstrings/comments and
  the PARETO_SEPARATION_NOTE prose string, never as a def/field/assignment. The permitted-vs-
  forbidden distinction is respected precisely: the frozen weights (_W_PRESERVATION/_W_INFO_
  RETAINED/_W_COHERENCE) combine utility COMPONENTS inside UtilityScore (allowed); no weight,
  sum, or arithmetic anywhere fuses the privacy and utility AXES (forbidden). AX-003: the
  privacy axis is a genuine MeasuredRRS carrying Wilson CIs (reid_recall_ci / reid_precision_ci),
  inherited unchanged from S3-04. AX-002/NFR-004: module imports only re + dataclasses (+
  intra-package adversary/reidentification); the AST import-purity guard bans exactly
  {random,time,uuid,datetime,secrets} and is GREEN; runtime determinism reconfirmed
  (score_utility(x)==score_utility(x)). AX-001: test fixtures are synthetic-only (toy names
  Jane/Alice/Bob, a 4-digit toy account 1234; zero Luhn-valid cards, zero valid SSNs, no real
  public figure paired with contact data). reidentification.py is git-UNTOUCHED by S3-06 (REUSED
  via one score_reidentification(...) call), and __init__.py changes are export-only. 7/7 owned
  tests pass and the full suite is 150 passed / 0 regressions on independent re-run.

axioms_in_scope:
