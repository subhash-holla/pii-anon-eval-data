# ── PRIMARY: the [AUDIT] privacy-correctness controls ─────────────────────────────────
primary_controls:

  - id: NFR-005_AX-004_no_merge
    requirement: "NFR-005 / AX-004 — privacy & utility are an unmergeable Pareto point; no single de-id scalar"
    status: PASS
    severity_if_breached: SHOWSTOPPER
    evidence:
      - "ParetoPoint declares ONLY fields {residual_risk, utility, variant, note} and methods {__post_init__, as_dict} (AST + runtime introspection)."
      - "No numeric-coercion dunder on the class: __float__/__int__/__index__/__complex__/__round__/__trunc__ all absent; float(ParetoPoint) raises TypeError (verified at runtime)."
      - "No forbidden merged-metric name {combined, overall, overall_score, deid, de_identification_score, deidentification_score, score} (plus probed extras merged/fused/aggregate/fitness/de_id) is DEFINED anywhere in anonymization.py (ast.FunctionDef/AnnAssign/Assign walk) NOR present as a class/instance attribute (hasattr)."
      - "as_dict() returns exactly {privacy, utility, variant, note}; d['privacy'] and d['utility'] are two SEPARATE dict objects (is-not), and there are NO root-level numeric scalars fusing the axes."
      - "The two axes are nested objects of DIFFERENT types (MeasuredRRS vs UtilityScore) — no arithmetic field combines them; the frozen weights inside UtilityScore combine utility COMPONENTS only (explicitly permitted by §8b)."
      - "UtilityScore likewise exposes no numeric-coercion dunder; its as_dict() keys are {utility, components, probe}."
    notes: >-
      The substring 'combined' that appears once in the serialized as_dict output is the
      PARETO_SEPARATION_NOTE disclaimer prose ('...are NEVER combined into a single
      de-identification score...'), confirmed to live only in d['note'] and not in any key or
      metric value. This is the separation guarantee being asserted, not a fused metric — not a finding.

  - id: FR-009_caveat_non_strippable
    requirement: "FR-009 — residual-risk axis (MeasuredRRS) carries the anti-anonymity caveat non-strippably through ParetoPoint.as_dict()"
    status: PASS
    severity_if_breached: SHOWSTOPPER
    evidence:
      - "ParetoPoint.as_dict()['privacy'] nests MeasuredRRS.as_dict(), which nests RRSResult.as_dict() whose 'caveat' key is always serialized."
      - "Runtime: as_dict()['privacy']['rrs']['caveat'] contains the 'MUST NOT be cited ... anonymized under GDPR/HIPAA' text."
      - "Non-strippability is STRUCTURAL upstream: RRSResult.caveat is a MANDATORY no-default field whose __post_init__ rejects empty/blank — a MeasuredRRS cannot be constructed without it, so anonymization.py cannot emit a Pareto point lacking the caveat. anonymization.py adds no code path that strips or overrides it."
      - "score_anonymization REUSES score_reidentification (S3-04) for the privacy axis — RRS is not reimplemented; reidentification.py is unmodified."

