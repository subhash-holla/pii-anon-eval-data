# ── ReDoS triage on the utility-probe placeholder regex over anonymized_text ──────────
redos_triage:
  patterns:
    placeholder: '\[[^\]]*\]|<[^>]*>|\*{2,}|█+|x{3,}'
    word: '\w+'
  finding: >-
    Neither pattern has nested/overlapping quantifiers; no exponential catastrophic
    backtracking. The placeholder alternation exhibits O(n^2) worst-case on a long run of
    UNBALANCED '[' or '<' (unanchored alternation restarts the [^\]]*/[^>]* scan at each
    position): doubling input ~quadruples time (32k→64k: ~0.49s→~2.0s), i.e. quadratic and
    BOUNDED by input length — not a ReDoS amplification. On realistic anonymized documents
    (balanced [NAME]/[REDACTED] tags, ≤10k chars) it runs <0.2 ms. anonymized_text is a
    scoring input (a candidate system's redacted doc); the version-pinned offline adversary —
    not the document author — is the in-boundary attacker in this threat model.
  severity: OBSERVATION
  matched_pattern_catalog: "#9-adjacent (regex over a gated path) — informational, no injection/DoS breach"

# ── Findings ──────────────────────────────────────────────────────────────────────────
findings:
  - id: S3-06-SEC-OBS-01
    severity: OBSERVATION
    title: "Placeholder regex is O(n^2) worst-case on unbalanced-bracket input (quadratic, not exponential)"
    file: src/pii_anon_datasets/scoring/anonymization.py
    line: 53
    detail: >-
      _PLACEHOLDER's unanchored alternation with negated char classes ([^\]]*, [^>]*) restarts
      at each position, giving quadratic worst-case time on a long contiguous run of unmatched
      '[' or '<' (measured ~2s at 64k such chars). It is NOT exponential and is bounded by
      input length; realistic anonymized docs score in well under 1 ms. anonymized_text is a
      scoring input, not an in-trust-boundary adversary surface. No current breach.
    recommendation: >-
      Optional hardening if very large untrusted documents ever reach this probe: cap
      anonymized_text length before scoring, or anchor/atomic-ize the placeholder alternation
      (e.g. restrict each branch's negated class with an explicit upper bound). Not blocking.
    pattern_ref: "catalog #9 (regex on a gated path) — advisory variant"

  - id: S3-06-SEC-OBS-02
    severity: OBSERVATION
    title: "No-merge guarantee rests on absence; recommend keeping the grep+introspection audit as a permanent regression fence"
    file: tests/test_anonymization.py
    line: 145
    detail: >-
      NFR-005/AX-004 is enforced by the ABSENCE of a merge path (no __float__, no fused field).
      The current code is clean. Because 'absence' invariants are easy to erode in later
      refactors (a convenience .overall property, a __float__ for sorting), the existing
      test_nfr005_pareto_point_cannot_merge [AUDIT] (hasattr + float() + as_dict + AST-grep,
      incl. its (D) empty-note rejection) is load-bearing and should remain a hard gate on this
      module. No change required this story.
    recommendation: "Keep the [AUDIT] guard; consider extending the forbidden-name set / coercion-dunder set if the de-id verdict surface grows."

