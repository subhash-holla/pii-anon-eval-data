# --- PRIMARY controls (the [AUDIT] gov-02 compliance-integrity gate) ----------
primary_controls:
  - id: PRIMARY-1
    control: "Crosswalk emits NO merged/equivalence compliance verdict"
    requirement: >
      No `compliant` / `deidentified` / `overall` / `equivalent` field or column;
      tag presence is an IN-SCOPE SIGNAL, never a determination. A wrong
      'GDPR-compliant: true' emitted from a tag would be a dangerous
      compliance-integrity failure.
    status: PASS
    evidence: >
      grep over crosswalk.py: zero bare `compliant` / `overall` / `equivalent`
      identifiers (those substrings occur ONLY in docstring/disclaimer prose);
      the sole `deidentified` occurrences are the legitimate regime-scoped
      `ccpa_deidentified` / `reg_ccpa_deidentified` (CCPA's own statutory term).
      No `True` / `False` literal is used as a regime value (the one `True` hit
      is `@dataclass(frozen=True)` decorator kwarg). RegimeStatus is a str-Enum
      with values {in_scope, out_of_scope_of_dataset} — a scope SIGNAL, not a
      pass/fail verdict. as_dict() keys = {5 regimes, other_regimes, disclaimer};
      forbidden∩cols = forbidden∩dict = empty set (verified live). A non-empty,
      __post_init__-enforced CROSSWALK_DISCLAIMER states it "INFORMS but does NOT
      MAKE a compliance determination."
  - id: PRIMARY-2
    control: "HIPAA stays TWO legally-distinct columns"
    requirement: >
      Safe-Harbor §164.514(b)(2) and Expert-Determination §164.514(b)(1) are
      different legal standards, never collapsed into one HIPAA verdict.
    status: PASS
    evidence: >
      REGIMES carries `hipaa_safe_harbor` and `hipaa_expert_determination` as
      two separate entries; two separate dataclass fields; two separate
      `reg_hipaa_*` columns; the `hipaa` tag fans out to BOTH via
      _TAG_TO_REGIMES. No collapsed `reg_hipaa` literal exists anywhere in the
      module (grep-confirmed). Test #2 asserts exactly these two columns and the
      absence of `reg_hipaa`.
  - id: PRIMARY-3
    control: "Test #3 source-grep guard has TEETH"
    requirement: >
      The guard must fail RED if a merged-verdict symbol were defined.
    status: PASS
    evidence: >
      crosswalk_mod.__file__ resolves to the LIVE impl at
      src/pii_anon_datasets/compliance/crosswalk.py (verified) — the grep reads
      the real source, not a stale copy. Mutation probe reproducing test #3's
      exact regex logic: planting each of `compliant: bool`, `overall:`,
      `equivalent:`, and `reg_regulatory_domains` into the source is CAUGHT by
      the guard (each yields a RED failure). The guard is a genuine structural
      backstop, not a tautology. Coverage note: the guard intentionally omits a
      bare `deidentified` word-match (since `ccpa_deidentified` legitimately
      contains it); that gap is fully closed by test #3's separate column-set and
      field-set disjointness assertions (forbidden∩cols, forbidden∩dict) plus the
      explicit `reg_deidentified` / `reg_compliant` absence checks.

# --- SECONDARY controls ------------------------------------------------------
secondary_controls:
  - id: SEC-INERT
    control: "Pure-stdlib, inert"
    status: PASS
    evidence: >
      Imports of crosswalk.py = {__future__, collections.abc, dataclasses,
      enum}; __init__.py adds only the intra-package re-export. Independent AST
      sweep: no eval / exec / compile / __import__ / subprocess / os.system /
      pickle / marshal / yaml / socket / urllib / http / requests / secrets /
      getpass / ctypes / importlib — by import OR by Name node. No network, no
      filesystem write, no dynamic code, no deserialization. Module is inert.
  - id: SEC-DETERMINISM
    control: "NFR-004 / AX-pii-anon-002 determinism (no nondeterminism imports)"
    status: PASS
    evidence: >
      AST guard (test #6 and independent re-run) confirms none of
      {random, time, uuid, datetime, secrets} imported. Pure function of input
      tags; order-preserving de-dup; no RNG/clock. Reproducible.
  - id: SEC-AX-001
    control: "AX-pii-anon-001 synthetic-only / no real PII (operates on caller dicts)"
    status: PASS
    evidence: >
      Module operates on caller-supplied record dicts and reads only the
      `regulatory_domains` key (coerced via str().strip().lower()); it neither
      stores nor logs record contents. Manual real-PII heuristic scan
      (SSN / Luhn-card / email / sk_|pk_|AKIA|ghp_ key shapes) over all three
      owned files: zero matches. Test fixtures use regime tags only
      ({gdpr, hipaa, ccpa, pci_dss, sox, lgpd, pipa}) — no PII.
  - id: SEC-INJECTION
    control: "No injection surface on a capability-gated path"
    status: PASS
    evidence: >
      No SQL/NoSQL, no string-built queries, no f-string into any sink. The one
      f-string (`f"reg_{regime}"`) interpolates only the frozen REGIMES constant,
      never user input. Non-FR-022 tags (sox/lgpd/pipa) are surfaced in
      other_regimes, never used to synthesize a column name (test #5 asserts no
      smuggled `reg_<tag>`).

