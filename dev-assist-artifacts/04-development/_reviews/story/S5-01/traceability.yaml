      CCPA-deidentified / PCI-DSS columns ... kept legally distinct at the display layer
      (no cross-regime equivalence). (UC-10, N9; MUST)". Line number matches the
      dispatch locator exactly.
  - id: tests_embed_fr_token
    description: Every test function name carries an fr_022 token.
    status: PASS
    evidence: >-
      All 6 test fns in tests/test_crosswalk.py are prefixed test_fr_022_*
      (test_fr_022_five_legally_distinct_columns, _hipaa_is_two_distinct_columns,
      _no_merged_or_equivalence_column, _presence_to_status_conservative,
      _corpus_tag_mapping, _nfr004_crosswalk_pure_stdlib).
  - id: pytest_k_selects_all_six
    description: >-
      `python3 -m pytest tests/test_crosswalk.py -k fr_022 -q` selects all 6 tests
      (story claim "selects all 6").
    status: PASS
    evidence: >-
      Ran the exact command: output "......" (6 dots), summary "6 passed in 0.11s",
      exit code 0, zero deselected. The -k filter is co-extensive with the file's
      6 tests; none leak outside the token.
  - id: symbol_docstrings_cite_fr_and_gov
    description: Symbol docstrings cite FR-022 / gov-02.
    status: PASS
    evidence: >-
      crosswalk.py module docstring L1 "(FR-022 / gov-02)"; RegulatoryCrosswalk
      docstring L83 "kept legally distinct (gov-02)"; crosswalk_record docstring
      L130 "Each FR-022 regime"; as_columns docstring L162 "no merged column (gov-02)";
      REGIMES/CROSSWALK_DISCLAIMER comments + L53 "(gov-02 / FR-022)". __init__.py L1
      "(FR-022 / gov-02)". Citations present on the package, module, dataclass, and
      both public functions.
  - id: fr022_contract_realized
    description: >-
      FR-022 contract (GDPR/HIPAA-SH/HIPAA-ED/CCPA-deid/PCI-DSS legally distinct,
      no equivalence) is realized in code and asserted by tests.
    status: PASS
    evidence: >-
      REGIMES = 5 ordered named regimes; RegulatoryCrosswalk has exactly those 5
      RegimeStatus fields + other_regimes + disclaimer and DELIBERATELY no merged
      field; HIPAA is two separate regimes (safe_harbor §164.514(b)(2),
      expert_determination §164.514(b)(1)); as_columns emits exactly 5 reg_* keys;
      no compliant/overall/equivalent symbol survives (verified independent grep on
      src — zero matches); reg_regulatory_domains absent from src. Forbidden-column
      set {compliant,deidentified,overall,equivalent,regulatory_domains} disjoint
      from emitted keys (the legitimate reg_ccpa_deidentified regime is not a false
      positive — source grep bans compliant/overall/equivalent as whole words only,
      column check is on emitted keys). All 6 tests pass.
  - id: gov02_cited_in_design
    description: gov-02 cited in D-implementation-ready-design.md.
    status: PASS
    evidence: >-
      03-design/06-synthesis/D-implementation-ready-design.md:104 (D6 LOCKED
      revisions, item 6): "Regulatory crosswalk = N separate typed columns in
      compliance/ + distribution/; the existing export_parquet.py regime-flattening
