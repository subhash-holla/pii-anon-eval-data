      addressable, no equivalence field. (gov-02 — FR-022 made structural.)" Story §4
      quotes this revision text faithfully.
  - id: no_name_says_x_asserts_y
    description: No test whose name claims X but body asserts unrelated Y.
    status: PASS
    evidence: >-
      Each of the 6 test bodies asserts exactly what its name states (five-columns →
      column set+ordering; hipaa-two → both HIPAA cols + no reg_hipaa collapse;
      no-merged → forbidden cols/fields + source grep; presence-conservative →
      in_scope/out_of_scope signal + disclaimer + __post_init__ guard; corpus-mapping →
      tag→regime map + sox/lgpd/pipa surfaced-not-folded; nfr004-stdlib → AST import
      ban). No mismatch.
  - id: provisional_status_cascade
    description: Story provisional_status matches source DC (DC-11 AGENT_SIMULATED, not DIVERGED).
    status: PASS
    evidence: >-
      Story §1 metadata and §4 both declare provisional_status: AGENT_SIMULATED;
      DC-11 is AGENT_SIMULATED, not DIVERGED — no DIVERGED cascade obligation. §12
      records the Pass-2 (real CI) commitment consistent with AGENT_SIMULATED.
  - id: dependencies_done
    description: Declared upstream dependencies are DONE.
    status: PASS
    evidence: >-
      §5 declares no new must-be-DONE dependencies (operates on a record's
      regulatory_domains tags). S5-01 BLOCKS S5-02/S5-06 (downstream) — no inbound
      blocker to verify.

