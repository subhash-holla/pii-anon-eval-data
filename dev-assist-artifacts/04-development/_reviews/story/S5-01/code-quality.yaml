findings:
  - id: code-quality-S5-01-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/compliance/crosswalk.py:170
    description: |
      Module-level `assert` at line 170 (structural invariant: dataclass field order matches
      REGIMES) fires at import time and has no accompanying `# PANIC:` or `# SAFETY:` comment.
      Under the project's active ruff config (select = ["E","F","I","UP","B"]), S101 is not
      enabled, so this passes `ruff check` cleanly. The assert is not on a production runtime
      call path — it is an import-time structural guard — and it holds verifiably. No
      blocking concern; comment would clarify intent for future readers.
    suggested_resolution: |
      Add an inline comment documenting that this assert is an import-time structural invariant,
      for example:
        # IMPORT-TIME INVARIANT: field order must mirror REGIMES so as_columns() getattr loop
        # is correct. Fails loudly at startup, not silently at runtime.
        assert tuple(f.name for f in fields(RegulatoryCrosswalk))[:5] == REGIMES
      No ruff/mypy rule change required.

