axioms_verified:

  - axiom: AX-pii-anon-002
    name: deterministic-reproducible-generation
    label_in_story: AX-002 determinism
    status: UPHELD
    evidence: >
      exposure_index + correlate_index_vs_rrs are pure functions of their inputs — no RNG,
      no clock, no I/O. Independent AST parse of reidentification.py imports ONLY
      {__future__, collections, dataclasses, math, adversary, stats} — the banned set
      {random,time,uuid,datetime,secrets} (extended in-test with numpy/scipy/pandas) is
      disjoint (verified out-of-band, not just via the in-repo test). Live determinism
      check: 5 repeated exposure_index() calls byte-identical (value=0.7333); 5 repeated
      correlate_index_vs_rrs() calls identical (spearman_rho==1.0 on the monotone set).
      Pearson/Spearman are stdlib-by-hand (covariance/stddev; Pearson-on-fractional-ranks).
    test_present: true
    test: tests/test_exposure_index.py::test_fr_008_nfr004_exposure_imports_no_nondeterminism  # PASS

  - axiom: NFR-004
    name: purity-stdlib-only
    status: UPHELD
    evidence: >
      stdlib only — no numpy/scipy/pandas anywhere on the path. _pearson_r and _rank are
      hand-rolled (math + comprehensions). The S3-01 signals module is reused
      (`from . import signals`; value = signals.compute_signal_density; per_signal weights =
      signals.UNIQUENESS_WEIGHT) rather than re-implemented. signals.py is itself import-pure
      (imports only {__future__, re, statistics}). The AST guard additionally bans the
      third-party numeric stack and holds.
    test_present: true
    test: tests/test_exposure_index.py::test_fr_008_nfr004_exposure_imports_no_nondeterminism  # PASS

  - axiom: FR-008-epistemic-honesty
    name: exposure-index-is-PRIOR-not-RRS (de-circularization honesty guarantee)
    status: UPHELD
    severity_if_violated: SHOWSTOPPER
    evidence: >
      The structural honesty guarantee holds on all four limbs, verified live:
      (1) DISTINCT TYPE — ExposureIndex is not a MeasuredRRS and not an RRSResult
      (isinstance False for both); dataclasses.fields carries NO rrs/reid_recall/reid_precision
      and hasattr is False for each — the heuristic is structurally uncitable as a re-id result.
      (2) NON-EMPTY VALIDATED NOTE — note is the module-level EXPOSURE_INDEX_NOTE, contains the
      literal "NOT measured RRS" and "prior"; __post_init__ raises on an empty note; as_dict()
      always serializes the note so the disclaimer travels with the number (mirrors the FR-009
      caveat discipline on RRSResult).
      (3) TRANSPARENT RECOMPUTE — value == signals.compute_signal_density(block) to 1e-9
      (=0.7333), computed from the per-category uniqueness annotations (0.6*peak+0.4*mean),
      NOT read from any precomputed scalar.
      (4) POISON TEST PASSES — injecting a lying behavioral_signal_density=0.123456 (and
      reidentification_contribution="low") into the block is IGNORED; the recomputed value
      stays 0.7333. correlate_index_vs_rrs is the EVIDENCE limb (Pearson+Spearman; n=0 and
      zero-variance -> nan, never raised).
    tests_present: true
    tests:
      - tests/test_exposure_index.py::test_fr_008_exposure_index_is_prior_not_rrs            # PASS
      - tests/test_exposure_index.py::test_fr_008_exposure_index_recomputes_density_transparently  # PASS (poison)
      - tests/test_exposure_index.py::test_fr_008_exposure_index_per_signal_transparent      # PASS
      - tests/test_exposure_index.py::test_fr_008_correlation_pearson_and_spearman           # PASS
      - tests/test_exposure_index.py::test_fr_008_correlation_n_zero_graceful                # PASS

  - axiom: AX-pii-anon-001
    name: synthetic-only-no-real-pii
    status: UPHELD
    evidence: >
      The only new corpus-adjacent artifact is the test fixture FIXED_SIGNALS_BLOCK, which
      contains ONLY synthetic category labels and lexical indicator tokens
      (industry_jargon:medical:3, topic:fitness:1, rich_vocabulary) plus uniqueness enums.
      Pattern scan for real-PII shapes (SSN / 16-digit card / email / phone) over
      tests/test_exposure_index.py: ZERO matches. No natural-person identifiers introduced.
    test_present: false   # invariant satisfied by construction; covered by sast hook at corpus scope

