  pure_stdlib:
    status: PASS
    detail: "reidentification.py top-level imports: __future__, math, collections.abc.Sequence, dataclasses + first-party ..stats.intervals and .scoring.{signals,adversary.base}. test_exposure_index.py: ast, dataclasses, math, pathlib + first-party scoring. No third-party runtime dep; no numpy/scipy/pandas (Pearson/Spearman hand-rolled in stdlib)."
  inert_surface:
    status: PASS
    detail: "Scan of all 3 owned files for eval/exec/compile/__import__/subprocess/os.system/popen/pickle/marshal/shelve/yaml/socket/requests/urllib/httpx/http.client/ctypes/input()/open()/getenv/os.environ/secrets found ZERO executable matches. The only textual hits are the banned-module string set inside the NFR-004 AST-guard test and its docstring. No network, no filesystem, no process spawn, no deserialization, no env/secret read. Programmatic AST walk confirms NO eval/exec/compile/__import__/input/open call nodes anywhere in reidentification.py."
  nondeterminism_free:
    status: PASS
    detail: "AX-002/NFR-004: production module imports NONE of {random,time,uuid,datetime,secrets} and no numpy/scipy/pandas (verified by re-running the test's own AST guard logic against reidentification.py — PASS). Logic is a pure function of caller-supplied dicts/pairs; no RNG, no clock, no I/O."
  import_purity_guard_present:
    status: PASS
    detail: "tests/test_exposure_index.py::test_fr_008_nfr004_exposure_imports_no_nondeterminism (PROPERTY-TEST, lines 149-167) AST-parses reidentification.py and asserts banned == {random,time,uuid,datetime,secrets,numpy,scipy,pandas} is disjoint from imports — the dispatch-required guard set is present and enforced in CI. PASS."
  synthetic_only_AX001:
    status: PASS
    detail: "AX-001: all test fixtures are abstract synthetic dicts — per-category {present,uniqueness,indicators} annotations (uniqueness labels + opaque indicator tokens like 'industry_jargon:medical:3') and numeric (index,rrs) pairs. Regex sweep for real-PII shapes (SSN/phone/email/CC/IBAN/API-key/AWS-key) over the test found NONE. The exposure_index public surface operates only over caller-supplied behavioral_signals dicts; no real-PII ingestion path, no dataset file read."
  weak_crypto:
    status: PASS
    detail: "No md5/sha1 or any hash primitive introduced; no crypto surface."
  hardcoded_credentials:
    status: PASS
    detail: "No credential/API-key/token/password shapes. Only string literals are the inert EXPOSURE_INDEX_NOTE disclaimer, the method-version strings, and synthetic test fixtures."
  injection_paths:
    status: PASS
    detail: "No SQL/NoSQL/shell/format-string interpolation; no capability-gated sink. exposure_index uses dict.get with safe defaults (no KeyError-based control flow on attacker input); correlate handles n==0 and zero-variance via math.nan (never raises). Pure arithmetic over caller-supplied values."
  supply_chain:
    status: PASS
    detail: "No new dependency added (additive imports are stdlib `math` + first-party `signals`). No git=/url-pinned dep, no manifest change, no new transitive package — CVE/SBOM surface unchanged at story scope."

