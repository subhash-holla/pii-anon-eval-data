    status: PASS
    claim: "The appended FR-008 exposure-index code does not alter, bypass, or weaken the existing FR-009 non-strippable anti-anonymity caveat on the RRS value objects."
    evidence:
      - "AST-equivalence proof (stronger than byte-equality): ANTI_ANONYMITY_CAVEAT, RRSResult, MeasuredRRS, and score_reidentification are ast.dump()-IDENTICAL between RED-parent (2fda0ef~1) and HEAD. The mandatory non-defaulted `caveat` field, RRSResult.__post_init__ empty-caveat guard, from_attack, as_dict, and MeasuredRRS.as_dict() caveat-nesting are unchanged."
      - "git diff 2fda0ef~1..HEAD on reidentification.py is 100% additive (140 insertions, 0 deletions in the existing region): the only edits inside the pre-existing block are two new top-level imports (`import math` line 21, `from . import signals` line 26) that the appended FR-008 code requires; the entire RRS contract below is untouched and the new symbols are appended after score_reidentification (line 181+)."
      - "ExposureIndex is a DISTINCT frozen dataclass with NO rrs/reid_recall/reid_precision field and a non-empty, __post_init__-validated `note` ('NOT measured RRS') — the de-circularization control holds; the cheap prior is structurally non-citable as an RRS result. It cannot be mistaken for / coerced into MeasuredRRS or RRSResult."
    test_proves_it:
      name: test_fr_008_exposure_index_is_prior_not_rrs
      file: tests/test_exposure_index.py:36-62
      result: "PASS. Asserts type(idx) is ExposureIndex, not isinstance MeasuredRRS/RRSResult, {rrs,reid_recall,reid_precision} disjoint from fields + not hasattr, note non-empty and contains 'NOT measured RRS'. Full file 6/6 PASS; existing tests/test_reidentification_measured.py 9/9 PASS (0 FR-009 regression)."
