    note: "Dispatch asked to confirm RRSResult/MeasuredRRS 'byte-preserved'. The two pre-existing contracts are AST-identical (semantic byte-preservation of the value objects). The only non-appended bytes are two additive import lines required by the new block — these introduce no new dep and do not touch the caveat path. Treated as satisfied; flagged here for transparency, not as a finding."

# ── INERTNESS / PURITY / SUPPLY-CHAIN / AX-001 (story-gate conditional checks) ──
