findings:
  - id: code-quality-S3-05-01
    severity: MINOR
    location: tests/test_exposure_index.py:36,66,87,120,140,150
    description: |
      All six test functions lack an explicit `-> None` return type annotation.
      Under `mypy --strict`, this fires `no-untyped-def` on each test function.
      The same omission is present in the pre-existing test files (verified:
      `test_reidentification_measured.py` has the identical pattern and the same
      mypy finding). It is therefore a REPO-WIDE pre-existing style choice, not a
      new regression introduced by S3-05; the executor's static-analysis claim
      ("added/touched lines clean") is accurate relative to the project's established
      test-file convention. Flagged as MINOR for awareness; no block.
    suggested_resolution: |
      Add `-> None` to each test function signature:
        def test_fr_008_...(self) -> None:
      This aligns with strict mypy and is the Python testing community's convention.
      Because the same gap exists repo-wide, a single follow-on task to sweep all
      test files would be cleaner than patching only S3-05's tests.
    references:
      - "https://mypy.readthedocs.io/en/stable/command_line.html#cmdoption-mypy-strict"

