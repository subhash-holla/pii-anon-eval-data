    test: test_fr_008_nfr004_exposure_imports_no_nondeterminism
    status: PASS

critical_checks:
  a_prior_structurally_distinct_from_measuredrrs:
    verdict: VERIFIED
    evidence: >-
      ExposureIndex is a separate frozen dataclass (reidentification.py:198) with NO
      rrs/reid_recall/reid_precision field; test asserts type(idx) is ExposureIndex,
      not isinstance MeasuredRRS/RRSResult, {rrs,reid_recall,reid_precision} disjoint
      from fields, and `not hasattr` each. Non-empty validated `note` (EXPOSURE_INDEX_NOTE)
      contains "NOT measured RRS" and "prior"; __post_init__ rejects empty note. The
      de-circularization guarantee is structurally enforced — the heuristic cannot be
      cited as an RRS result.
  b_recomputed_transparently_poison_test:
    verdict: VERIFIED
    evidence: >-
      exposure_index (reidentification.py:247) calls signals.compute_signal_density(block);
      compute_signal_density (signals.py:334-350) aggregates per-category `uniqueness`
      weights only — it never reads a precomputed scalar. The poison test (test file
      lines 80-83) injects behavioral_signal_density=0.123456 and
      reidentification_contribution="low" and asserts value stays 0.7333. Confirmed PASS.
  c_correlation_pearson_and_spearman_reported:
    verdict: VERIFIED
    evidence: >-
      IndexRRSCorrelation carries both pearson_r and spearman_rho; computed by-hand in
      pure stdlib (_pearson_r + _rank average-of-ties => Pearson-on-ranks). Test asserts
      spearman_rho==1.0 on a monotone set and 0.9 < pearson_r < 1.0 (genuinely distinct
      nonlinear Pearson, not a copy of Spearman); method names both. n==0 (and degenerate
      zero-variance) => nan, never raised.

findings:
  - id: S3-05-RC-OBS-01
    severity: OBSERVATION
    requirement: FR-008
    title: "per_signal unknown-uniqueness fallback (else 0.0) not directly exercised"
    detail: >-
      exposure_index's per_signal builder uses UNIQUENESS_WEIGHT.get(uniqueness, 0.0)
      (reidentification.py:241), a robustness fallback for an unrecognized uniqueness
      label. No test feeds an out-of-vocabulary label to pin that branch. This is
      adjacent robustness, not an FR-008 MUST clause — all §7/§6 clauses are covered.
      No action required at this gate.

counts:
