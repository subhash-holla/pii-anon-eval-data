findings:
  - id: traceability-S7-01-01
    severity: MINOR
    location: dev-assist-artifacts/02-requirements/traceability-matrix.md:15
    description: |
      The traceability matrix is not yet annotated for S7-01's FR-017 claim. The
      forward row "UC-08 agentic oracle | FR-017, FR-018, FR-020" (line 15) still
      shows a bare `AGENT_SIMULATED` with no "verified-by S7-01" marker, and the
      Status Change Log (lines 44-54) has no S7-01 / FR-017 / Sprint-7 entry. This
      is the canonical "traceability.md missing the row for this story's claim"
      pattern. Held at MINOR (not MAJOR) because this repo's established convention
      is that matrix Status-Change-Log rows are appended at story-gate APPROVE /
      sprint close (see the S5-* and S6-* entries on lines 47-54, all added on
      gate APPROVE), not while a story sits in REVIEW. The row is therefore
      legitimately pending this gate's outcome rather than missing-in-error.
    suggested_resolution: |
      On S7-01 story-gate APPROVE (and at the S7 sprint gate), append a Status
      Change Log row for FR-017 noting the oracle half is verified-by S7-01
      (provisional_status AGENT_SIMULATED; DC-10 bounded/COULD; Pass-2 CI re-run
      due at the sprint gate per §12), and note the oracle/payload partition
      (S7-01 = recognition oracle; S7-02 = injection payloads). FR-017 stays open
      until S7-02 lands the payload half.
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-017
      - dev-assist-artifacts/04-development/02-stories/sprint-7/S7-01.md#12
  - id: traceability-S7-01-02
    severity: OBSERVATION
    location: dev-assist-artifacts/04-development/02-stories/sprint-7/S7-01.md:35
    description: |
      §3 traces NFR-004 and AX-002 to the same pure-stdlib/deterministic test
      (test_nfr004_oracle_pure_stdlib, the AST banned-import guard). The matrix
      axiom linkage (traceability-matrix.md:30) confirms AX-pii-anon-002 -> NFR-004,
      so the AX-002 claim is correctly a transitive restatement of the NFR-004
      claim, not an independent unbacked axiom claim. Noted only so the gate reader
      knows AX-002 has no separate dedicated test (by design — it is the axiom
      behind NFR-004).
    suggested_resolution: |
      No action required. Optionally, when the matrix row is added on close, state
      explicitly that the AX-002 evidence is the NFR-004 stdlib AST guard.
    references:
      - dev-assist-artifacts/02-requirements/traceability-matrix.md#axiom-nfr-linkage
