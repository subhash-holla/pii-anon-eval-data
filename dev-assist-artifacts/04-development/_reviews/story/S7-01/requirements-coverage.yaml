    location: dev-assist-artifacts/02-requirements/functional-requirements.md#FR-017
    description: |
      FR-017 ("PII-recognition oracle + payload library", UC-08; SHOULD) is a
      BIPARTITE requirement: "(a) a callable oracle API returns labeled-entity
      verdicts, AND (b) injection payloads ship as (obfuscated-span +
      injection-carrier-template + intent-tag) tuples (multilingual/obfuscated);
      never marketed as agent-leakage scoring."

      S7-01 delivers ONLY clause (a) — the oracle-API half — plus the
      non-strippable "never agent-leakage scoring" scope guard. Clause (b), the
      injection-payload-library, is NOT implemented and has NO test in this
      story. It is correctly deferred to the named successor S7-02 (S7-01 §5
      "Blocks: S7-02 (payloads ride alongside the oracle in scoring/adversary/)").

      Therefore FR-017 is PARTIALLY satisfied with an explicit named successor —
      it must NOT be recorded as fully closed on S7-01 alone. Flagging as a
      coverage OBSERVATION (deferred-with-successor, not a silent gap) so the
      traceability/MUST-board status for FR-017 stays "partial — clause (a) done
      S7-01, clause (b) pending S7-02" rather than flipping to DONE.
    suggested_resolution: |
      Keep FR-017's coverage row marked PARTIAL until S7-02 lands clause (b).
      Ensure the FR-017 → S7-01/S7-02 split is reflected in the traceability
      matrix (S7-01 = oracle-API clause; S7-02 = payload-library clause). No
      change required in S7-01 itself. Note: the S7-02 story file does not yet
      exist on disk — author it before the S7 sprint gate so the deferral target
      is a real, schedulable story (named successor is present in S7-01 §5, which
      satisfies the story-gate deferral bar).
    references:
      - dev-assist-artifacts/02-requirements/functional-requirements.md#FR-017
      - dev-assist-artifacts/04-development/02-stories/sprint-7/S7-01.md#5-dependencies

