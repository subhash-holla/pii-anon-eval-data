  supporting_requirements: [FR-009, reidx-02, reidx-01, FR-010, gov-01, NFR-002, AX-002]
  note_for_sprint_gate: >
    FR-007 MUST is now substantively covered for the offline-adversary headline path
    (empirical recall/precision + Wilson CIs on integer counts, RRS=1-r*p, |C| stated).
    Recall/precision/|C| verified GENUINELY MEASURED from live adversary.attack() output,
    not read from any precomputed corpus field. FR-009 non-strippable caveat realized
    structurally via MeasuredRRS.as_dict() nesting RRSResult.as_dict() (mandatory,
    non-defaulted caveat field on the byte-preserved S1 RRSResult).

verification_evidence:
  test_file: tests/test_reidentification_measured.py
  rerun_command: python3 -m pytest tests/test_reidentification_measured.py -q
  rerun_result: "9 passed in 0.13s"
  fr_token_selection: "pytest -k 'fr_007 or fr_009' collects exactly 9 (S3-01 gate lesson satisfied)"

acceptance_clause_coverage:
  - clause: "empirical re-id recall measured w/ Wilson CI on integer counts"
    test: test_fr_007_recall_ci_uses_integer_n_targets
    status: PASS
  - clause: "empirical re-id precision measured on integer non-abstain count"
    test: test_fr_007_precision_ci_uses_integer_n_guesses
    status: PASS
  - clause: "RRS = 1 - recall*precision (exact identity)"
    test: test_fr_007_rrs_equals_one_minus_recall_times_precision
    status: PASS
  - clause: "ground-truth-link correctness (guessed_persona_id == target_id)"
    test: test_fr_007_correct_is_guesses_matching_target_id
    status: PASS
  - clause: "abstain excluded from precision denominator (not counted wrong)"
    test: test_fr_007_abstentions_excluded_from_precision_denominator
    status: PASS
  - clause: "FR-009 caveat non-strippable through MeasuredRRS.as_dict() [AUDIT]"
    test: test_fr_009_caveat_nonstrippable_in_measured_as_dict
    status: PASS
  - clause: "reidx-02 fractional count -> TypeError (integer guard)"
    test: test_fr_007_reidx02_fractional_count_raises
    status: PASS
  - clause: "perfect attack -> RRS=0; all-abstain -> n_guesses=0, recall=0 -> RRS=1 (n=0 Wilson sentinel)"
    test: test_fr_007_perfect_attack_rrs_zero_and_no_commit_rrs_one
    status: PASS
  - clause: "|C| recorded; adversary_id + deterministic propagate (version-pinning); real adversary E2E"
    test: test_fr_007_candidate_set_size_recorded
    status: PASS

measured_not_precomputed_check:
  verdict: CONFIRMED_MEASURED
  evidence: >
    score_reidentification (reidentification.py:152) calls adversary.attack() live; derives
    `correct` by per-guess comparison guessed_persona_id == target_id (line 157) and computes
    recall/precision from integer tallies (lines 158-159). OfflineDeterministicAdversary emits
    live Guess objects (offline_adversary.py:244) and holds NO precomputed recall/precision/RRS
    field. Target.observed_signals is re-extracted via signals.extract per reidx-01, never gold
    Persona.behavioral_signals. No precomputed corpus field is consulted.

