# ── PRIMARY CHECK (the [AUDIT] privacy control) ──
audit_findings:
  fr_009_caveat_nonstrippable:
    status: PASS
    claim: "No code path can serialize an RRS number without its anti-anonymity caveat."
    evidence:
      - "MeasuredRRS.as_dict() (reidentification.py:105-123) ALWAYS sets out['rrs'] = self.rrs.as_dict(); the nested RRSResult.as_dict() (:69-79) ALWAYS emits the 'caveat' key."
      - "MeasuredRRS exposes exactly ONE serializer (as_dict); grep for asdict/to_dict/model_dump/json.dump found no alternate path that could emit rrs without the caveat."
      - "MeasuredRRS.rrs is a mandatory, non-defaulted field (default is MISSING) — a MeasuredRRS cannot exist without an RRSResult."
      - "RRSResult.caveat is mandatory + non-defaulted (default=MISSING, default_factory=MISSING); RRSResult.__post_init__ ALSO rejects empty/whitespace caveat (ValueError). Construct-without-caveat raises TypeError (verified live)."
      - "Both RRSResult and MeasuredRRS are frozen dataclasses — the caveat cannot be mutated/blanked post-construction."
    test_proves_it:
      name: test_fr_009_caveat_nonstrippable_in_measured_as_dict
      file: tests/test_reidentification_measured.py:144-158
      result: "PASS (9/9 in file pass). Asserts d['rrs'] is a dict, 'caveat' in d['rrs'], and the literal 'MUST NOT be cited' substring survives nesting — proves the caveat travels with the number, not merely that a key exists."
  frozen_rrsresult_contract_preserved:
    status: PASS
    evidence:
      - "git diff f33b3e5..bfa5cf9 on reidentification.py: the RRSResult class body (incl. mandatory non-defaulted `caveat` field, __post_init__ guard, from_attack, as_dict) and ANTI_ANONYMITY_CAVEAT are byte-identical; the only edits are additive (module docstring note, 2 imports, MeasuredRRS + score_reidentification appended below)."

