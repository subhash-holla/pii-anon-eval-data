findings:
  - id: code-quality-S3-04-01
    severity: OBSERVATION
    location: src/pii_anon_datasets/scoring/reidentification.py:58
    description: |
      UP037 (quoted annotation `-> "RRSResult":` on `RRSResult.from_attack`) fires under
      `ruff check`. This is a PRE-EXISTING nit from the S1 baseline (confirmed via
      `git show f33b3e5^:src/pii_anon_datasets/scoring/reidentification.py` — line 58
      reads `-> "RRSResult":` in the frozen `RRSResult.from_attack` classmethod). S3-04
      was explicitly prohibited from modifying the frozen `RRSResult` contract.
      Routing separately per the reviewer brief; NOT a hold for this story.
    suggested_resolution: |
      Track as a separate technical-debt item scoped to RRSResult. Fix in the sprint that
      lifts the freeze on that class (or in a dedicated lint-debt story). The fix is a
      one-character change: remove the quotes (`-> RRSResult:`) — valid here because
      `from __future__ import annotations` is already active at line 19.
    references:
      - dev-assist-artifacts/04-development/02-stories/sprint-3/S3-04.md#12

  - id: code-quality-S3-04-02
    severity: OBSERVATION
    location: src/pii_anon_datasets/scoring/reidentification.py:69
    description: |
      `mypy --strict` reports `[type-arg] Missing type parameters for generic type "dict"`
      on `def as_dict(self) -> dict:` inside `RRSResult`. PRE-EXISTING in the S1 baseline
      (same line, same return type in `git show f33b3e5^`). S3-04 did not touch this line;
      the frozen contract prohibition applies. Routing separately; NOT a hold.
    suggested_resolution: |
      Track alongside code-quality-S3-04-01 (same freeze-lift opportunity). Fix:
      `def as_dict(self) -> dict[str, object]:` — the same pattern correctly applied to
      `MeasuredRRS.as_dict` by the executor in the REFACTOR commit (379f086).
    references:
      - dev-assist-artifacts/04-development/02-stories/sprint-3/S3-04.md#12

  - id: code-quality-S3-04-03
    severity: OBSERVATION
    location: tests/test_reidentification_measured.py:70-202
    description: |
      All 9 test functions lack `-> None` return-type annotations. `mypy --strict` reports
      `[no-untyped-def]` for each. However, this pattern is consistent with the existing
      project baseline for test files (confirmed: `tests/test_detection.py` and every prior
      S3 story test file carry the same omission). The executor scoped `mypy --strict` to
      the production module only (`scoring/reidentification.py`), which is where the
      regression risk lies. No `-> None` annotations are present in any prior test file in
      this project; this is a project-wide test-file convention, not a per-story defect.
    suggested_resolution: |
      Optionally address project-wide in a single lint-debt pass by adding `-> None` to all
      test functions, or configure `[mypy.overrides]` for the `tests` module to disable
      `no-untyped-def`. Either fix could be part of a contributor-readiness gate pass.

  - id: code-quality-S3-04-04
    severity: OBSERVATION
    location: tests/test_reidentification_measured.py:168,170
    description: |
      `mypy --strict --follow-imports=silent tests/test_reidentification_measured.py`
      reports `[unused-ignore]` on the `# type: ignore[arg-type]` comments at lines 168
      and 170 (inside `test_fr_007_reidx02_fractional_count_raises`). This is an artifact
      of `--follow-imports=silent` silently dropping type info for `wilson_interval`; with
      full import resolution mypy would see the `int` parameter type and the `arg-type`
      ignore would be load-bearing. The comments are intentional and required: they allow
      the test to pass float literals to a function that rejects them at runtime (which is
      the exact behavior being tested). No real dead-ignore scenario — it is the incomplete
      type graph under `--follow-imports=silent` on the test module.
    suggested_resolution: |
      No change needed for this story. If a future pass runs mypy with full import
      resolution on the test package, the `[unused-ignore]` warnings will disappear
      (the suppression becomes load-bearing again). Alternatively, document the silence with
      a comment: `# type: ignore[arg-type]  # intentional: testing the runtime guard`.

