checks:
  - id: declared-ids-exist
    status: PASS
    detail: >
      FR-007 ("measured RRS") and FR-009 ("non-strippable caveat") both present in
      requirements-document.md (FR index, line 19). reidx-02 / reidx-01 are design-level
      constraints defined in 03-design/06-synthesis/D-implementation-ready-design.md and
      cited by the story as SUPPORTING constraints (not primary FRs) — correctly sourced.
      DC-07 is the story's source DC (AGENT_SIMULATED, not DIVERGED).
  - id: tests-embed-fr-tokens
    status: PASS
    detail: >
      `pytest tests/test_reidentification_measured.py -k fr_007 -q` selects 8 tests;
      `-k fr_009 -q` selects 1 test. Both >0 (S3-01 gate lesson satisfied). All 9 collect
      and pass (9 passed). Module docstring + MeasuredRRS/score_reidentification docstrings
      cite FR-007/008/009 + reidx-02 explicitly (reidentification.py L1-18, L84-92, L134-151).
  - id: fr-007-contract-realized
    status: PASS
    detail: >
      score_reidentification realizes the FR-007 contract: empirical recall = correct/n_targets
      and precision = correct/n_guesses with Wilson CIs on INTEGER (correct, n_targets) and
      (correct, n_guesses) via wilson_interval (reidx-02 integer guard); RRS = 1 - recall*precision
      via RRSResult.from_attack; |C| (candidate_set_size), adversary_id, deterministic all recorded
      on MeasuredRRS. n=0 edges defer to the stats.intervals n=0 sentinel (no fabricated CI).
  - id: fr-009-contract-realized
    status: PASS
    detail: >
      FR-009 realized by NESTING the frozen S1 RRSResult: MeasuredRRS.rrs is an RRSResult
      whose mandatory non-defaulted `caveat` carries ANTI_ANONYMITY_CAVEAT; MeasuredRRS.as_dict()
      nests rrs.as_dict() so the caveat is always serialized. RRSResult contract byte-preserved
      (no edits to L34-79). Caveat substring "MUST NOT be cited" asserted by the [AUDIT] test
      is present in the live constant (verified at runtime).
  - id: name-vs-assertion-coherence
    status: PASS
    detail: >
      All 8 fr_007-named tests assert FR-007 / reidx-02 content (CI denominators, 1-r*p identity,
      ground-truth link, abstention semantics, |C|+version-pin, perfect/no-commit edges, fractional
      -> TypeError guard). The 1 fr_009-named test asserts the non-strippable-caveat semantics.
      No name-says-X-asserts-Y mismatch.
  - id: dependencies-done
    status: PASS
    detail: "§5 deps S3-01 (Status: DONE) and S3-02 (Status: DONE) — both valid DONE prerequisites."
  - id: traceability-matrix-row
    status: PASS
    detail: >
      traceability-matrix.md is UC-level (columns: UC | FRs | NFRs | Priority | provisional_status),
      not a per-story ledger (0 story-id refs across the whole file; sibling DONE stories S3-01/S3-02
      likewise have no rows). UC-05 row (line 12) "measured RRS | FR-007, FR-008, FR-009, FR-010 |
      NFR-007 | MUST | AGENT_SIMULATED" covers the story's claimed FRs. Finding pattern #4
      (missing story row) does not apply to this matrix design.
  - id: provisional-status-cascade
    status: PASS
    detail: >
      Story provisional_status = AGENT_SIMULATED; source DC-07 = AGENT_SIMULATED, not DIVERGED;
      UC-05 matrix row = AGENT_SIMULATED. Consistent. No DIVERGED cascade obligation triggered,
      so no §10 Pass 2 commitment required beyond the sprint-CI Pass 2 already noted in §12.

findings: []

