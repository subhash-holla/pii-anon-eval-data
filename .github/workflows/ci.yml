name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev extras; the scoring/stats core is pure-stdlib)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Frozen committed-lattice guard
        run: PYTHONPATH=src python -m pii_anon_datasets.stats.lattice --check
      - name: Doc-drift (NFR-013)
        run: PYTHONPATH=src python -m pytest -q tests/test_doc_drift.py
      - name: Test suite (fixture-based)
        run: PYTHONPATH=src python -m pytest -q

  lint:
    name: lint (ruff, advisory)
    runs-on: ubuntu-latest
    # eval-data has no committed ruff config and a documented pre-existing stylistic-nit backlog (mostly E701
    # one-liners / F541) inherent to the pure-stdlib idiom; lint is surfaced but non-blocking until a scoped
    # [tool.ruff] config is adopted. The test suite (above) is the load-bearing gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests scripts

# ------------------------------------------------------------------------------------------------------------
# NOT in this workflow (by design — the >100MB corpus is distributed via HuggingFace under CC0, NOT git):
#   * scripts/validate.py NFR-018 power gate over the 575,604-record corpus,
#   * the Parquet/Croissant round-trips and the real-detector tests (need heavy extras),
#   * scripts/benchmark_throughput.py and the FR-027 real-data correlation.
# These run in a SEPARATE data-bearing workflow that fetches the corpus from HuggingFace. CI NEVER fabricates:
# the throughput verdict stays INSUFFICIENT_EVIDENCE and the real-data correlation stays RealDataAbsent here.
